<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Neon Rush — Luigi</title>
    <style>
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #05010f;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      #renderCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
        z-index: 0;
        /* No hub o menu precisa receber o clique; na corrida reativamos */
        pointer-events: none;
      }

      #renderCanvas.racing {
        pointer-events: auto;
      }

      #hud {
        display: none;
        position: fixed;
        left: 16px;
        top: 16px;
        color: #b8f3ff;
        text-shadow: 0 0 8px #00e5ff;
        pointer-events: none;
        user-select: none;
        z-index: 2;
      }

      #hud.show {
        display: block;
      }

      /* Hub estilo Brawl Stars / Stumble Guys: carro no centro */
      #mainMenu {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(
          ellipse 55% 50% at 50% 55%,
          transparent 0%,
          rgba(5, 1, 20, 0.15) 55%,
          rgba(5, 1, 20, 0.55) 100%
        );
      }

      #mainMenu.show {
        display: block;
      }

      #mainMenu .hit {
        pointer-events: auto;
      }

      .menu-brand {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
      }

      .menu-brand h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 48px);
        letter-spacing: 6px;
        color: #ff4fd8;
        text-shadow: 0 0 18px #ff4fd8, 0 0 36px #00e5ff;
      }

      .menu-brand p {
        margin: 4px 0 0;
        font-size: 12px;
        letter-spacing: 3px;
        color: #b8f3ff;
        text-shadow: 0 0 8px #00e5ff;
      }

      .menu-rail {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 86px;
      }

      .menu-money {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 10px 8px;
        border: 2px solid #ffd24a;
        background: rgba(10, 4, 30, 0.82);
        box-shadow: 0 0 14px rgba(255, 210, 74, 0.25);
        color: #ffe79a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .menu-money span {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        opacity: 0.85;
      }

      .menu-stats {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px 8px;
        border: 2px solid rgba(0, 229, 255, 0.55);
        background: rgba(10, 4, 30, 0.82);
        box-shadow: 0 0 14px rgba(0, 229, 255, 0.18);
        color: #b8f3ff;
      }

      .menu-stat {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
      }

      .menu-stat span {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 1px;
        opacity: 0.85;
      }

      .menu-stat strong {
        font-size: 14px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #fff;
        text-shadow: 0 0 8px rgba(0, 229, 255, 0.45);
      }

      .boost-badge {
        margin-top: 2px;
        font-size: 9px !important;
        letter-spacing: 0.5px !important;
        opacity: 1 !important;
      }

      .boost-badge.mult {
        color: #39ff9f;
        text-shadow: 0 0 8px rgba(57, 255, 159, 0.55);
      }

      .boost-badge.tire {
        color: #7ec8ff;
        text-shadow: 0 0 8px rgba(126, 200, 255, 0.55);
      }

      .rail-btn {
        appearance: none;
        width: 100%;
        min-height: 72px;
        padding: 8px 6px;
        border: 2px solid #00e5ff;
        background: rgba(10, 4, 30, 0.82);
        color: #b8f3ff;
        font-size: 11px;
        letter-spacing: 1px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-shadow: 0 0 8px #00e5ff;
        transition: background 0.15s ease, box-shadow 0.15s ease,
          transform 0.15s ease;
      }

      .rail-btn .icon {
        font-size: 22px;
        line-height: 1;
      }

      .rail-btn:hover:not(:disabled),
      .rail-btn:focus-visible:not(:disabled) {
        background: rgba(0, 229, 255, 0.18);
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.3);
        outline: none;
      }

      .rail-btn:disabled {
        opacity: 0.4;
        cursor: default;
        border-color: #556;
        color: #99a;
        text-shadow: none;
      }

      .menu-play-wrap {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        width: min(200px, 42vw);
      }

      .play-btn {
        appearance: none;
        border: 3px solid #39ff9f;
        background: linear-gradient(
          180deg,
          rgba(57, 255, 159, 0.35),
          rgba(20, 120, 80, 0.55)
        );
        color: #eafff4;
        font-size: clamp(22px, 4vw, 30px);
        font-weight: 800;
        letter-spacing: 3px;
        padding: 22px 18px;
        cursor: pointer;
        text-shadow: 0 0 12px rgba(57, 255, 159, 0.8);
        box-shadow: 0 0 28px rgba(57, 255, 159, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .play-btn:hover,
      .play-btn:focus-visible {
        transform: scale(1.04);
        box-shadow: 0 0 36px rgba(57, 255, 159, 0.5);
        outline: none;
      }

      .play-btn:active {
        transform: scale(0.98);
      }

      .menu-hint {
        text-align: center;
        font-size: 12px;
        color: #b8f3ff;
        opacity: 0.9;
        pointer-events: none;
        margin: 0;
        letter-spacing: 1px;
        text-shadow: 0 0 8px currentColor;
      }

      .track-picker {
        display: flex;
        flex-direction: column;
        gap: 6px;
        width: 100%;
        position: relative;
        z-index: 2;
      }

      .track-switch-btn {
        appearance: none;
        width: 100%;
        border: 2px solid #ff4fd8;
        background: rgba(255, 79, 216, 0.18);
        color: #ffe3f8;
        cursor: pointer;
        padding: 12px 10px;
        text-align: center;
        box-shadow: 0 0 16px rgba(255, 79, 216, 0.25);
      }

      .track-switch-btn:hover,
      .track-switch-btn:focus-visible {
        background: rgba(255, 79, 216, 0.32);
        outline: none;
      }

      .track-switch-btn:active {
        transform: scale(0.98);
      }

      .track-switch-btn small {
        display: block;
        font-size: 10px;
        letter-spacing: 1px;
        opacity: 0.85;
        margin-bottom: 4px;
      }

      .track-switch-btn strong {
        display: block;
        font-size: 14px;
        letter-spacing: 1px;
      }

      #garagePanel {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 6;
        pointer-events: none;
      }

      #garagePanel.show {
        display: block;
      }

      #mainMenu.garage-open .menu-play-wrap,
      #mainMenu.garage-open .menu-brand p,
      #mainMenu.shop-open .menu-play-wrap,
      #mainMenu.shop-open .menu-brand p {
        opacity: 0;
        pointer-events: none;
      }

      #shopPanel {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 6;
        pointer-events: none;
      }

      #shopPanel.show {
        display: block;
      }

      .shop-offer-dots {
        display: flex;
        gap: 8px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .shop-offer-dot {
        width: 10px;
        height: 10px;
        border: 1px solid rgba(0, 229, 255, 0.55);
        background: rgba(0, 229, 255, 0.12);
        cursor: pointer;
        pointer-events: auto;
        padding: 0;
      }

      .shop-offer-dot.active {
        background: #00e5ff;
        box-shadow: 0 0 10px rgba(0, 229, 255, 0.55);
      }

      .shop-price {
        margin: 0;
        font-size: 20px;
        font-weight: 800;
        letter-spacing: 1px;
        color: #ffd24a;
        text-shadow: 0 0 12px rgba(255, 210, 74, 0.45);
      }

      .shop-price.cant-afford {
        color: #ff8a8a;
        text-shadow: 0 0 10px rgba(255, 100, 100, 0.35);
      }

      .shop-buy {
        appearance: none;
        border: 1px solid #ffd24a;
        background: rgba(255, 210, 74, 0.12);
        color: #ffe79a;
        font-size: 12px;
        letter-spacing: 1px;
        padding: 6px 14px;
        cursor: pointer;
      }

      .shop-buy:hover:not(:disabled) {
        background: rgba(255, 210, 74, 0.24);
      }

      .shop-buy:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .shop-empty {
        margin: 0;
        font-size: 13px;
        letter-spacing: 1px;
        color: #b8f3ff;
        text-align: center;
        opacity: 0.9;
      }

      .garage-nav {
        pointer-events: auto;
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        width: 56px;
        height: 56px;
        border: 2px solid #00e5ff;
        background: rgba(8, 2, 24, 0.72);
        color: #b8f3ff;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(0, 229, 255, 0.28);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0;
      }

      .garage-nav:hover {
        background: rgba(0, 229, 255, 0.18);
        color: #fff;
      }

      .garage-nav.prev {
        left: max(16px, 4vw);
      }

      .garage-nav.next {
        right: max(16px, 4vw);
      }

      .garage-footer {
        pointer-events: auto;
        position: absolute;
        left: 50%;
        bottom: 22px;
        transform: translateX(-50%);
        width: min(420px, 90vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        padding: 12px 16px;
        border: 2px solid rgba(0, 229, 255, 0.55);
        background: rgba(8, 2, 24, 0.78);
        box-shadow: 0 0 22px rgba(0, 229, 255, 0.2);
      }

      .garage-footer-top {
        display: flex;
        align-items: baseline;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .garage-car-name {
        margin: 0;
        font-size: 18px;
        letter-spacing: 2px;
        color: #fff;
        text-shadow: 0 0 10px rgba(0, 229, 255, 0.55);
      }

      .garage-car-rarity {
        margin: 0;
        font-size: 12px;
        letter-spacing: 1px;
        font-weight: 700;
      }

      .garage-car-status {
        margin: 0;
        font-size: 12px;
        letter-spacing: 1.5px;
        font-weight: 700;
        color: #b8f3ff;
      }

      .garage-car-status.locked {
        color: #ff8a8a;
      }

      .garage-car-status.equipped {
        color: #39ff9f;
      }

      .garage-car-index {
        margin: 0;
        font-size: 11px;
        opacity: 0.7;
        color: #b8f3ff;
        letter-spacing: 1px;
      }

      .garage-actions {
        display: flex;
        gap: 8px;
        width: 100%;
        justify-content: center;
      }

      .garage-close,
      .garage-equip {
        appearance: none;
        border: 1px solid #00e5ff;
        background: transparent;
        color: #b8f3ff;
        font-size: 12px;
        letter-spacing: 1px;
        padding: 6px 14px;
        cursor: pointer;
      }

      .garage-equip {
        border-color: #39ff9f;
        color: #39ff9f;
      }

      .garage-equip:disabled {
        opacity: 0.35;
        cursor: default;
      }

      .garage-close:hover,
      .garage-equip:hover:not(:disabled) {
        background: rgba(0, 229, 255, 0.14);
      }

      @media (max-width: 640px) {
        .menu-rail {
          width: 70px;
          left: 8px;
        }

        .menu-play-wrap {
          right: 8px;
          width: min(150px, 40vw);
        }

        .play-btn {
          padding: 16px 10px;
          letter-spacing: 2px;
        }

        .garage-nav {
          width: 46px;
          height: 46px;
          font-size: 24px;
        }

        .garage-nav.prev {
          left: 8px;
        }

        .garage-nav.next {
          right: 8px;
        }
      }

      #hud h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: 2px;
        color: #ff4fd8;
        text-shadow: 0 0 10px #ff4fd8;
      }

      #hud p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
      }

      #rankingPanel {
        display: none;
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 3;
        min-width: 280px;
        padding: 14px 16px 12px;
        border: 2px solid #ff4fd8;
        box-shadow: 0 0 24px rgba(255, 79, 216, 0.35);
        background: rgba(10, 4, 30, 0.88);
        color: #fff;
        pointer-events: none;
        user-select: none;
        transform: translate(0, 0);
        transition:
          right 0.55s cubic-bezier(0.22, 1, 0.36, 1),
          top 0.55s cubic-bezier(0.22, 1, 0.36, 1),
          transform 0.55s cubic-bezier(0.22, 1, 0.36, 1),
          min-width 0.55s ease,
          box-shadow 0.55s ease;
      }

      #rankingPanel.show {
        display: block;
      }

      #rankingPanel.centered {
        top: 50%;
        right: 50%;
        min-width: min(360px, 86vw);
        transform: translate(50%, -50%);
        box-shadow: 0 0 40px rgba(255, 79, 216, 0.45);
      }

      #rankingPanel h2 {
        margin: 0 0 10px;
        font-size: 18px;
        letter-spacing: 2px;
        color: #ff4fd8;
        text-shadow: 0 0 10px #ff4fd8;
      }

      .ranking-row {
        display: grid;
        grid-template-columns: 36px 1fr 64px;
        gap: 8px;
        align-items: center;
        padding: 6px 4px;
        font-size: 14px;
        color: #b8f3ff;
        border-top: 1px solid rgba(184, 243, 255, 0.15);
      }

      .ranking-row.you {
        color: #fff;
        text-shadow: 0 0 8px #00e5ff;
      }

      .ranking-row.pending {
        opacity: 0.45;
      }

      .ranking-row .pos {
        font-weight: 700;
        color: #ff4fd8;
      }

      .ranking-row .time {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      #rankingHint {
        display: none;
        margin: 12px 0 0;
        font-size: 13px;
        color: #b8f3ff;
        text-align: center;
        line-height: 1.55;
      }

      #rankingHint.show {
        display: block;
      }

      #countdownOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 4;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: rgba(5, 1, 20, 0.35);
      }

      #countdownOverlay.show {
        display: flex;
      }

      #countdownNumber {
        font-size: 120px;
        font-weight: 700;
        letter-spacing: 8px;
        color: #ff4fd8;
        text-shadow: 0 0 28px #ff4fd8, 0 0 60px #00e5ff;
        text-align: center;
      }

      #debugFps {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        padding: 6px 10px;
        border: 1px solid #39ff9f;
        background: rgba(5, 1, 20, 0.85);
        color: #39ff9f;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 1px;
        pointer-events: none;
        user-select: none;
      }

      #debugFps.show {
        display: block;
      }

      #debugPerfBtn {
        display: none;
        width: 100%;
        appearance: none;
        margin-top: 8px;
        padding: 10px 8px;
        border: 2px solid #39ff9f;
        background: rgba(10, 4, 30, 0.88);
        color: #39ff9f;
        font-size: 11px;
        letter-spacing: 1px;
        cursor: pointer;
      }

      #debugPerfBtn.show {
        display: block;
      }

      #debugPerfBtn:disabled {
        opacity: 0.5;
        cursor: wait;
      }

      #debugPerfReport {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 48px;
        z-index: 21;
        max-width: min(420px, 92vw);
        max-height: 45vh;
        overflow: auto;
        padding: 10px 12px;
        border: 1px solid #39ff9f;
        background: rgba(5, 1, 20, 0.92);
        color: #b8fff0;
        font-size: 12px;
        line-height: 1.45;
        white-space: pre-wrap;
        pointer-events: auto;
        user-select: text;
      }

      #debugPerfReport.show {
        display: block;
      }

    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="tracks/neon-circuit-1.js"></script>
    <script src="tracks/sunset-rush.js"></script>
    <script src="cars/catalog.js"></script>
    <script src="audio.js"></script>
  </head>
  <body>
    <div id="mainMenu" class="show">
      <div class="menu-brand">
        <h1>NEON RUSH</h1>
        <p>CORRIDA FUTURISTA</p>
      </div>

      <aside class="menu-rail hit" aria-label="Opções">
        <div class="menu-money" title="Moedas">
          <span>MOEDAS</span>
          <strong id="moneyLabel">0</strong>
          <span id="multiplierBadge" class="boost-badge mult" hidden>×3 próxima</span>
          <span id="tireBadge" class="boost-badge tire" hidden>Pneu 70</span>
        </div>
        <div class="menu-stats" aria-label="Conta">
          <div class="menu-stat" title="Carros desbloqueados">
            <span>CARROS</span>
            <strong id="carsCollectionLabel">1/1</strong>
          </div>
          <div class="menu-stat" title="Vitórias em 1º lugar">
            <span>VITÓRIAS</span>
            <strong id="winsLabel">0</strong>
          </div>
        </div>
        <button type="button" class="rail-btn" id="btnShop" title="Comprar carros">
          <span class="icon">▣</span>
          Loja
        </button>
        <button type="button" class="rail-btn" id="btnGarage" title="Trocar carro">
          <span class="icon">▣</span>
          Garagem
        </button>
      </aside>

      <div class="menu-play-wrap hit">
        <div class="track-picker" aria-label="Escolher pista">
          <button type="button" class="track-switch-btn" id="btnTrackSwitch" title="Trocar de pista">
            <small>CLIQUE PARA TROCAR A PISTA</small>
            <strong id="trackNameLabel">—</strong>
          </button>
        </div>
        <button type="button" class="play-btn" id="btnStartRace">JOGAR</button>
        <p id="equippedCarLabel" class="menu-hint"></p>
        <button type="button" id="debugPerfBtn">Teste FPS (diagnóstico)</button>
      </div>
    </div>
    <div id="garagePanel" aria-hidden="true">
      <button type="button" class="garage-nav prev" id="btnGaragePrev" aria-label="Carro anterior">‹</button>
      <button type="button" class="garage-nav next" id="btnGarageNext" aria-label="Próximo carro">›</button>
      <div class="garage-footer">
        <div class="garage-footer-top">
          <h2 class="garage-car-name" id="garageCarName">—</h2>
          <p class="garage-car-rarity" id="garageCarRarity"></p>
        </div>
        <p class="garage-car-status" id="garageCarStatus"></p>
        <p class="garage-car-index" id="garageCarIndex"></p>
        <div class="garage-actions">
          <button type="button" class="garage-equip" id="btnGarageEquip" disabled>Equipar</button>
          <button type="button" class="garage-close" id="btnGarageClose">Fechar</button>
        </div>
      </div>
    </div>
    <div id="shopPanel" aria-hidden="true">
      <button type="button" class="garage-nav prev" id="btnShopPrev" aria-label="Oferta anterior">‹</button>
      <button type="button" class="garage-nav next" id="btnShopNext" aria-label="Próxima oferta">›</button>
      <div class="garage-footer">
        <div class="shop-offer-dots" id="shopOfferDots"></div>
        <div class="garage-footer-top">
          <h2 class="garage-car-name" id="shopCarName">—</h2>
          <p class="garage-car-rarity" id="shopCarRarity"></p>
        </div>
        <p class="shop-price" id="shopCarPrice"></p>
        <p class="shop-empty" id="shopEmptyMsg" hidden>Sem ofertas agora — você já tem todos!</p>
        <p class="garage-car-index" id="shopOfferIndex"></p>
        <div class="garage-actions">
          <button type="button" class="shop-buy" id="btnShopBuy" disabled>Comprar</button>
          <button type="button" class="garage-close" id="btnShopClose">Fechar</button>
        </div>
      </div>
    </div>
    <div id="debugPerfReport"></div>
    <div id="hud">
      <h1>NEON RUSH</h1>
      <p>↑ acelerar · ↓ frear · ← → virar</p>
      <p id="speedLabel">Velocidade: 0</p>
      <p id="progressLabel">Progresso: 0%</p>
      <p id="placeLabel">Posição: 1º / 3</p>
    </div>
    <div id="countdownOverlay">
      <div id="countdownNumber">3</div>
    </div>
    <div id="rankingPanel">
      <h2>RANKING</h2>
      <div id="rankingList"></div>
      <p id="rankingHint">Pressione Enter ou Espaço para voltar ao menu</p>
    </div>
    <div id="debugFps">-- FPS</div>
    <canvas id="renderCanvas"></canvas>
    <script>
      const canvas = document.getElementById("renderCanvas");
      const speedLabel = document.getElementById("speedLabel");
      const progressLabel = document.getElementById("progressLabel");

      function getTrackIds() {
        return Object.keys(window.NEON_RUSH_TRACKS || {});

      function applySavedTrack() {
        const saved = localStorage.getItem(TRACK_STORAGE_KEY);
        if (saved && window.NEON_RUSH_TRACKS && window.NEON_RUSH_TRACKS[saved]) {
          window.NEON_RUSH_ACTIVE_TRACK = saved;
        } else if (!window.NEON_RUSH_ACTIVE_TRACK) {
          const ids = getTrackIds();
          window.NEON_RUSH_ACTIVE_TRACK = ids[0] || "neon-circuit-1";
        }
        localStorage.setItem(
          TRACK_STORAGE_KEY,
          window.NEON_RUSH_ACTIVE_TRACK
        );
      }

      function refreshTrackLabel() {
        const label = document.getElementById("trackNameLabel");
        if (!label) return;
        const ids = getTrackIds();
        const id = window.NEON_RUSH_ACTIVE_TRACK;
        const data =
          window.NEON_RUSH_TRACKS && window.NEON_RUSH_TRACKS[id];
        const name = data ? data.name : id || "—";
        const idx = Math.max(0, ids.indexOf(id));
        label.textContent =
          ids.length > 1
            ? name + "  (" + (idx + 1) + "/" + ids.length + ")"
            : name;
      }

      // Preenchido por createScene — troca a pista sem reload (Simple Browser do Cursor)
      let switchTrackInScene = null;

      function stepActiveTrack(delta) {
        const ids = getTrackIds();
        if (ids.length < 2) {
          window.alert(
            "Só existe 1 pista carregada. Confira se o arquivo tracks/sunset-rush.js abriu no navegador."
          );
          return;
        }
        const current = window.NEON_RUSH_ACTIVE_TRACK;
        let idx = ids.indexOf(current);
        if (idx < 0) idx = 0;
        idx = (idx + delta + ids.length) % ids.length;
        const nextId = ids[idx];
        localStorage.setItem(TRACK_STORAGE_KEY, nextId);
        window.NEON_RUSH_ACTIVE_TRACK = nextId;

        if (typeof switchTrackInScene === "function") {
          const ok = switchTrackInScene(nextId);
          if (ok) {
            refreshTrackLabel();
            return;
          }
        }

        // Fallback se a cena ainda não estiver pronta
        try {
          window.location.reload();
        } catch (err) {
          refreshTrackLabel();
        }
      }

      function setCanvasInteractive(enabled) {
        canvas.classList.toggle("racing", !!enabled);
      }

      function loadCoins() {
        const saved = localStorage.getItem(COINS_STORAGE_KEY);
        const value = saved === null ? 0 : parseInt(saved, 10);
        return Number.isFinite(value) && value >= 0 ? value : 0;
      }

      function saveCoins(amount) {
        localStorage.setItem(COINS_STORAGE_KEY, String(amount));
      }

      function loadPendingCoinMultiplier() {
        const saved = parseInt(
          localStorage.getItem(COIN_MULTIPLIER_KEY) || "1",
          10
        );
        return saved > 1 ? saved : 1;
      }

      function savePendingCoinMultiplier(mult) {
        if (mult > 1) {
          localStorage.setItem(COIN_MULTIPLIER_KEY, String(mult));
        } else {
          localStorage.removeItem(COIN_MULTIPLIER_KEY);
        }
      }

      function hasPendingCoinMultiplier() {
        return loadPendingCoinMultiplier() > 1;
      }

      function activateCoinMultiplier() {
        savePendingCoinMultiplier(COIN_MULTIPLIER_VALUE);
      }

      function hasPendingCalibratedTire() {
        return localStorage.getItem(CALIBRATED_TIRE_KEY) === "1";
      }

      function activateCalibratedTire() {
        localStorage.setItem(CALIBRATED_TIRE_KEY, "1");
      }

      function consumeCalibratedTire() {
        localStorage.removeItem(CALIBRATED_TIRE_KEY);
      }

      function rollPriceBetween(min, max) {
        return min + Math.floor(Math.random() * (max - min + 1));
      }

      let coins = loadCoins();

      function refreshMoneyLabel() {
        moneyLabel.textContent = String(coins);
        const multBadge = document.getElementById("multiplierBadge");
        if (multBadge) {
          multBadge.hidden = !hasPendingCoinMultiplier();
        }
        const tireBadge = document.getElementById("tireBadge");
        if (tireBadge) {
          tireBadge.hidden = !hasPendingCalibratedTire();
        }
      }

      function rewardCoinsForPlace(place) {
        const base = COIN_REWARDS[place] || 0;
        const multiplier = loadPendingCoinMultiplier();
        const gained = base * multiplier;
        if (multiplier > 1) {
          savePendingCoinMultiplier(1);
        }
        if (gained > 0) {
          coins += gained;
          saveCoins(coins);
        }
        refreshMoneyLabel();
        return { gained: gained, multiplier: multiplier, base: base };
      }

        if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = true;
        if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = true;
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;

      function makeNeonMaterial(name, scene, color, glow = 0.85) {
        const mat = new BABYLON.StandardMaterial(name, scene);
        mat.diffuseColor = color.scale(0.25);
        mat.emissiveColor = color.scale(glow);
        mat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.3);
        return mat;
      }

      const EQUIPPED_CAR_KEY = "neonRush.equippedCar";
      const PURCHASED_CARS_KEY = "neonRush.purchasedCars";

      function getCarDef(carId) {
        return (
          (window.NEON_RUSH_CARS && window.NEON_RUSH_CARS[carId]) ||
          window.NEON_RUSH_CARS.starter
        );
      }

      function loadPurchasedCars() {
        try {
          const saved = JSON.parse(
            localStorage.getItem(PURCHASED_CARS_KEY)
          );
          if (Array.isArray(saved)) {
            return saved.filter(function (id) {
              return window.NEON_RUSH_CARS && window.NEON_RUSH_CARS[id];
            });
          }
        } catch (e) {}
        return [];
      }

      function savePurchasedCars(ids) {
        localStorage.setItem(PURCHASED_CARS_KEY, JSON.stringify(ids));
      }

      function purchaseCar(carId) {
        const purchased = loadPurchasedCars();
        if (purchased.indexOf(carId) === -1) {
          purchased.push(carId);
          savePurchasedCars(purchased);
          refreshAccountStats();
        }
      }

      function shuffleArray(list) {
        const arr = list.slice();
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = arr[i];
          arr[i] = arr[j];
          arr[j] = tmp;
        }
        return arr;
      }

      function loadOwnedCars() {
        // Só o que vem de graça + o que foi comprado na loja
        const owned = Object.keys(window.NEON_RUSH_CARS || {}).filter(
          function (id) {
            return window.NEON_RUSH_CARS[id].ownedByDefault;
          }
        );
        loadPurchasedCars().forEach(function (id) {
          if (owned.indexOf(id) === -1) owned.push(id);
        });
        // Limpa save antigo que liberava carros sem comprar
        localStorage.removeItem("neonRush.ownedCars");
        return owned;
      }

        brace.material = ironMat;
        brace.parent = car;

        const blueMat = new BABYLON.StandardMaterial("sirenBlue_" + id, scene);
        blueMat.diffuseColor = new BABYLON.Color3(0.05, 0.15, 0.95);
        blueMat.emissiveColor = new BABYLON.Color3(0.08, 0.25, 1);
        blueMat.specularColor = new BABYLON.Color3(0.3, 0.4, 0.95);

        // Meia esquerda vermelha / direita azul
        const sirenRed = BABYLON.MeshBuilder.CreateBox(
          "sirenRed_" + id,

          { width: 0.48, height: 0.16, depth: 0.24 },
          scene
        );
        sirenBlue.position.set(0.26, 1.38, -0.05);
        sirenBlue.material = blueMat;
        sirenBlue.parent = car;

        // Bolinhas extras na barra (piscam junto)
        const bulbRed = BABYLON.MeshBuilder.CreateSphere(
          "sirenBulbR_" + id,
          { diameter: 0.14, segments: 8 },
          scene
        );
        bulbRed.position.set(-0.42, 1.42, -0.05);
        bulbRed.material = redMat;
        bulbRed.parent = car;

        const bulbBlue = BABYLON.MeshBuilder.CreateSphere(
          "sirenBulbB_" + id,
          { diameter: 0.14, segments: 8 },
          scene
        );
        bulbBlue.position.set(0.42, 1.42, -0.05);
        bulbBlue.material = blueMat;
        bulbBlue.parent = car;

        const redOn = new BABYLON.Color3(1.2, 0.08, 0.1);
        const redOff = new BABYLON.Color3(0.15, 0.02, 0.02);
        const blueOn = new BABYLON.Color3(0.1, 0.3, 1.3);
        const blueOff = new BABYLON.Color3(0.02, 0.04, 0.18);

        const sirenObs = scene.onBeforeRenderObservable.add(() => {
          if (!car || car.isDisposed()) {
            scene.onBeforeRenderObservable.remove(sirenObs);
            return;
          }
          // Alterna vermelho/azul ~4x por segundo
          const phase = Math.floor(performance.now() / 220) % 2 === 0;
          redMat.emissiveColor = phase ? redOn : redOff;
          blueMat.emissiveColor = phase ? blueOff : blueOn;
        });

        return car;
      }

      function createFlyghtCar(scene, id, bodyColor, accentColor) {
        // Lendário: planador sem rodas. Root em y=0 (mesma altura dos outros);

        const car = new BABYLON.TransformNode("car_" + id, scene);
        const hull = new BABYLON.TransformNode("flyghtHull_" + id, scene);
        hull.parent = car;
        hull.position.y = 0; // igual a um carro com rodas

        const bodyMat = new BABYLON.StandardMaterial("flyghtBody_" + id, scene);
        bodyMat.diffuseColor = bodyColor.scale(0.55);
        bodyMat.emissiveColor = bodyColor.scale(0.35);
        bodyMat.specularColor = new BABYLON.Color3(0.85, 0.85, 0.95);

        const accentMat = makeNeonMaterial(
          "flyghtAccent_" + id,
          scene,
          accentColor,
          1.05
        );

        const darkMat = new BABYLON.StandardMaterial("flyghtDark_" + id, scene);
        darkMat.diffuseColor = new BABYLON.Color3(0.06, 0.07, 0.1);

      function getActiveTrackData() {
        const id = window.NEON_RUSH_ACTIVE_TRACK;
        const data = window.NEON_RUSH_TRACKS && window.NEON_RUSH_TRACKS[id];
        if (!data) {
          throw new Error("Pista não encontrada: " + id);
        }
        return data;
      }

      function buildTrackFromData(trackData) {
        const controls = trackData.controlPoints.map(function (p) {
          return new BABYLON.Vector3(p[0], p[1], p[2]);
        });
        const curve = BABYLON.Curve3.CreateCatmullRomSpline(controls, 25, false);
        const path3D = new BABYLON.Path3D(
          curve.getPoints(),
          new BABYLON.Vector3(0, 1, 0)
        );

        const startPos = new BABYLON.Vector3(
          trackData.startPoint[0],
          trackData.startPoint[1],
          trackData.startPoint[2]
        );
        const finishPos = new BABYLON.Vector3(
          trackData.finishPoint[0],
          trackData.finishPoint[1],
          trackData.finishPoint[2]
        );

        const startDist = path3D.getDistanceAt(
          path3D.getClosestPositionTo(startPos)
        );
        const finishDist = path3D.getDistanceAt(
          path3D.getClosestPositionTo(finishPos)
        );

        return {
          data: trackData,
          path3D: path3D,
          trackLength: path3D.length(),
          startDist: startDist,
          finishDist: finishDist,
          raceLength: Math.max(1, finishDist - startDist),
        };
      }

      function samplePath(path3D, distance) {
        const total = path3D.length();
        const t = Math.max(0, Math.min(1, distance / total));
        return {
          total,
          t,
          position: path3D.getPointAt(t),
          tangent: path3D.getTangentAt(t).normalize(),
          normal: path3D.getNormalAt(t).normalize(),
          binormal: path3D.getBinormalAt(t).normalize(),
        };
      }

      function distanceAlongPath(path3D, worldPos) {
        return path3D.getDistanceAt(path3D.getClosestPositionTo(worldPos));
      }

      function raceProgressFromDistance(distAlong, track) {
        return Math.max(
          0,
          Math.min(1, (distAlong - track.startDist) / track.raceLength)
        );
      }
