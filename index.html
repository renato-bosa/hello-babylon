<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Neon Rush — Luigi</title>
    <style>
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #05010f;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }

      #hud {
        position: fixed;
        left: 16px;
        top: 16px;
        color: #b8f3ff;
        text-shadow: 0 0 8px #00e5ff;
        pointer-events: none;
        user-select: none;
        z-index: 2;
      }

      #hud h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: 2px;
        color: #ff4fd8;
        text-shadow: 0 0 10px #ff4fd8;
      }

      #hud p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
      }

      #finishOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 3;
        align-items: center;
        justify-content: center;
        background: rgba(5, 1, 20, 0.55);
        pointer-events: none;
      }

      #finishOverlay.show {
        display: flex;
      }

      #finishCard {
        text-align: center;
        color: #fff;
        padding: 28px 40px;
        border: 2px solid #ff4fd8;
        box-shadow: 0 0 30px rgba(255, 79, 216, 0.45);
        background: rgba(10, 4, 30, 0.85);
      }

      #finishCard h2 {
        margin: 0 0 10px;
        font-size: 42px;
        letter-spacing: 3px;
        color: #ff4fd8;
        text-shadow: 0 0 16px #ff4fd8;
      }

      #finishCard p {
        margin: 0;
        font-size: 16px;
        color: #b8f3ff;
      }

      #countdownOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 4;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: rgba(5, 1, 20, 0.35);
      }

      #countdownOverlay.show {
        display: flex;
      }

      #countdownNumber {
        font-size: 120px;
        font-weight: 700;
        letter-spacing: 8px;
        color: #ff4fd8;
        text-shadow: 0 0 28px #ff4fd8, 0 0 60px #00e5ff;
        text-align: center;
      }

      #countdownNumber.ready {
        font-size: 36px;
        letter-spacing: 2px;
        line-height: 1.4;
        max-width: 80vw;
      }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
  </head>
  <body>
    <div id="hud">
      <h1>NEON RUSH</h1>
      <p>↑ acelerar · ↓ frear · ← → virar</p>
      <p id="speedLabel">Velocidade: 0</p>
      <p id="progressLabel">Progresso: 0%</p>
      <p id="placeLabel">Posição: 1º / 3</p>
    </div>
    <div id="countdownOverlay">
      <div id="countdownNumber">3</div>
    </div>
    <div id="finishOverlay">
      <div id="finishCard">
        <h2 id="finishTitle">CHEGOU!</h2>
        <p id="finishPlace">Você ficou em 1º</p>
        <p id="finishTime">Tempo: 0s</p>
        <p>Pressione R para correr de novo</p>
      </div>
    </div>
    <canvas id="renderCanvas"></canvas>
    <script>
      const canvas = document.getElementById("renderCanvas");
      const speedLabel = document.getElementById("speedLabel");
      const progressLabel = document.getElementById("progressLabel");
      const placeLabel = document.getElementById("placeLabel");
      const finishOverlay = document.getElementById("finishOverlay");
      const finishTitle = document.getElementById("finishTitle");
      const finishPlace = document.getElementById("finishPlace");
      const finishTime = document.getElementById("finishTime");
      const countdownOverlay = document.getElementById("countdownOverlay");
      const countdownNumber = document.getElementById("countdownNumber");
      const engine = new BABYLON.Engine(canvas, true);

      // Física IGUAL para jogador e rivais (sem vantagem)
      const PHYSICS = {
        maxSpeed: 55,
        accel: 28,
        brake: 40,
        friction: 10,
        turnRate: 1.2,
        laneLimit: 5.5,
      };

      const keys = {
        up: false,
        down: false,
        left: false,
        right: false,
      };

      window.addEventListener("keydown", (e) => {
        if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = true;
        if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = true;
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
      });

      window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
        if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = false;
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
      });

      function makeNeonMaterial(name, scene, color, glow = 0.85) {
        const mat = new BABYLON.StandardMaterial(name, scene);
        mat.diffuseColor = color.scale(0.25);
        mat.emissiveColor = color.scale(glow);
        mat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.3);
        return mat;
      }

      function createCar(scene, id, bodyColor, accentColor) {
        const car = new BABYLON.TransformNode("car_" + id, scene);

        const bodyMat = makeNeonMaterial("bodyMat_" + id, scene, bodyColor, 0.7);
        const accentMat = makeNeonMaterial(
          "accentMat_" + id,
          scene,
          accentColor,
          1
        );
        const darkMat = new BABYLON.StandardMaterial("darkMat_" + id, scene);
        darkMat.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.1);
        darkMat.emissiveColor = new BABYLON.Color3(0.02, 0.02, 0.05);

        const body = BABYLON.MeshBuilder.CreateBox(
          "body_" + id,
          { width: 1.6, height: 0.45, depth: 3.2 },
          scene
        );
        body.position.y = 0.45;
        body.material = bodyMat;
        body.parent = car;

        const cabin = BABYLON.MeshBuilder.CreateBox(
          "cabin_" + id,
          { width: 1.2, height: 0.4, depth: 1.4 },
          scene
        );
        cabin.position.set(0, 0.85, -0.2);
        cabin.material = darkMat;
        cabin.parent = car;

        const stripe = BABYLON.MeshBuilder.CreateBox(
          "stripe_" + id,
          { width: 1.65, height: 0.08, depth: 3.25 },
          scene
        );
        stripe.position.y = 0.7;
        stripe.material = accentMat;
        stripe.parent = car;

        const nose = BABYLON.MeshBuilder.CreateBox(
          "nose_" + id,
          { width: 1.2, height: 0.2, depth: 0.8 },
          scene
        );
        nose.position.set(0, 0.35, 1.7);
        nose.material = accentMat;
        nose.parent = car;

        return car;
      }

      function createTrackControlPoints() {
        return [
          new BABYLON.Vector3(0, 0, 0),
          new BABYLON.Vector3(0, 0, 50),
          new BABYLON.Vector3(8, 0, 100),
          new BABYLON.Vector3(28, 0, 150),
          new BABYLON.Vector3(35, 0, 210),
          new BABYLON.Vector3(18, 0, 270),
          new BABYLON.Vector3(-10, 0, 320),
          new BABYLON.Vector3(-30, 0, 380),
          new BABYLON.Vector3(-22, 0, 440),
          new BABYLON.Vector3(0, 0, 500),
          new BABYLON.Vector3(20, 0, 560),
          new BABYLON.Vector3(12, 0, 620),
          new BABYLON.Vector3(0, 0, 680),
          new BABYLON.Vector3(0, 0, 740),
        ];
      }

      function buildPath3D() {
        const controls = createTrackControlPoints();
        const curve = BABYLON.Curve3.CreateCatmullRomSpline(controls, 25, false);
        return new BABYLON.Path3D(curve.getPoints(), new BABYLON.Vector3(0, 1, 0));
      }

      function samplePath(path3D, distance) {
        const total = path3D.length();
        const t = Math.max(0, Math.min(1, distance / total));
        return {
          total,
          t,
          position: path3D.getPointAt(t),
          tangent: path3D.getTangentAt(t).normalize(),
          normal: path3D.getNormalAt(t).normalize(),
          binormal: path3D.getBinormalAt(t).normalize(),
        };
      }

      function createRoadPiece(scene, sample, roadMat, edgeMat, index) {
        const pieceLength = 8;
        const group = new BABYLON.TransformNode("roadPiece_" + index, scene);
        group.position.copyFrom(sample.position);
        group.rotation.y = Math.atan2(sample.tangent.x, sample.tangent.z);

        const road = BABYLON.MeshBuilder.CreateGround(
          "road_" + index,
          { width: 14, height: pieceLength },
          scene
        );
        road.material = roadMat;
        road.parent = group;

        const leftEdge = BABYLON.MeshBuilder.CreateBox(
          "leftEdge_" + index,
          { width: 0.25, height: 0.2, depth: pieceLength },
          scene
        );
        leftEdge.position.set(-7, 0.1, 0);
        leftEdge.material = edgeMat;
        leftEdge.parent = group;

        const rightEdge = BABYLON.MeshBuilder.CreateBox(
          "rightEdge_" + index,
          { width: 0.25, height: 0.2, depth: pieceLength },
          scene
        );
        rightEdge.position.set(7, 0.1, 0);
        rightEdge.material = edgeMat;
        rightEdge.parent = group;

        const dash = BABYLON.MeshBuilder.CreateBox(
          "dash_" + index,
          { width: 0.2, height: 0.05, depth: 3 },
          scene
        );
        dash.position.set(0, 0.03, 0);
        dash.material = edgeMat;
        dash.parent = group;

        return group;
      }

      function createFinishLine(scene, sample) {
        const gate = new BABYLON.TransformNode("finishGate", scene);
        gate.position.copyFrom(sample.position);
        gate.rotation.y = Math.atan2(sample.tangent.x, sample.tangent.z);

        const pink = makeNeonMaterial(
          "finishPink",
          scene,
          new BABYLON.Color3(1, 0.2, 0.85),
          1
        );
        const cyan = makeNeonMaterial(
          "finishCyan",
          scene,
          new BABYLON.Color3(0.2, 0.95, 1),
          1
        );
        const white = makeNeonMaterial(
          "finishWhite",
          scene,
          new BABYLON.Color3(1, 1, 1),
          0.9
        );

        const leftPost = BABYLON.MeshBuilder.CreateBox(
          "leftPost",
          { width: 0.4, height: 6, depth: 0.4 },
          scene
        );
        leftPost.position.set(-7, 3, 0);
        leftPost.material = pink;
        leftPost.parent = gate;

        const rightPost = BABYLON.MeshBuilder.CreateBox(
          "rightPost",
          { width: 0.4, height: 6, depth: 0.4 },
          scene
        );
        rightPost.position.set(7, 3, 0);
        rightPost.material = cyan;
        rightPost.parent = gate;

        const banner = BABYLON.MeshBuilder.CreateBox(
          "banner",
          { width: 14.4, height: 1.2, depth: 0.2 },
          scene
        );
        banner.position.set(0, 5.5, 0);
        banner.material = pink;
        banner.parent = gate;

        for (let i = 0; i < 8; i++) {
          const stripe = BABYLON.MeshBuilder.CreateBox(
            "finishStripe_" + i,
            { width: 1.6, height: 0.06, depth: 1.2 },
            scene
          );
          stripe.position.set(-6.3 + i * 1.8, 0.04, 0);
          stripe.material = i % 2 === 0 ? white : pink;
          stripe.parent = gate;
        }

        return gate;
      }

      function createBuilding(scene, position, neonColors, id) {
        const height = 6 + Math.random() * 18;
        const width = 3 + Math.random() * 3;
        const depth = 3 + Math.random() * 3;

        const building = BABYLON.MeshBuilder.CreateBox(
          "building_" + id,
          { width, height, depth },
          scene
        );
        building.position.copyFrom(position);
        building.position.y = height / 2;

        const color = neonColors[Math.floor(Math.random() * neonColors.length)];
        const mat = new BABYLON.StandardMaterial("buildMat_" + id, scene);
        mat.diffuseColor = new BABYLON.Color3(0.02, 0.02, 0.06);
        mat.emissiveColor = color.scale(0.35 + Math.random() * 0.35);
        building.material = mat;

        return building;
      }

      function normalizeAngle(angle) {
        while (angle > Math.PI) angle -= Math.PI * 2;
        while (angle < -Math.PI) angle += Math.PI * 2;
        return angle;
      }

      const createScene = function () {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.02, 0.01, 0.08, 1);
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.012;
        scene.fogColor = new BABYLON.Color3(0.04, 0.02, 0.1);

        const hemi = new BABYLON.HemisphericLight(
          "hemi",
          new BABYLON.Vector3(0, 1, 0),
          scene
        );
        hemi.intensity = 0.35;
        hemi.groundColor = new BABYLON.Color3(0.05, 0.02, 0.1);

        const neonColors = [
          new BABYLON.Color3(1, 0.2, 0.85),
          new BABYLON.Color3(0.2, 0.9, 1),
          new BABYLON.Color3(0.5, 0.3, 1),
          new BABYLON.Color3(1, 0.5, 0.2),
        ];

        const roadMat = new BABYLON.StandardMaterial("roadMat", scene);
        roadMat.diffuseColor = new BABYLON.Color3(0.04, 0.04, 0.08);
        roadMat.emissiveColor = new BABYLON.Color3(0.03, 0.03, 0.07);

        const edgeMat = makeNeonMaterial(
          "edgeMat",
          scene,
          new BABYLON.Color3(0.2, 0.95, 1),
          1
        );

        const path3D = buildPath3D();
        const trackLength = path3D.length();

        const step = 7;
        let pieceIndex = 0;
        for (let d = 0; d < trackLength; d += step) {
          createRoadPiece(
            scene,
            samplePath(path3D, d),
            roadMat,
            edgeMat,
            pieceIndex++
          );
        }

        const finishSample = samplePath(path3D, trackLength - 1);
        createFinishLine(scene, finishSample);

        let buildingId = 0;
        for (let d = 10; d < trackLength; d += 14) {
          const sample = samplePath(path3D, d);
          const side = sample.binormal;
          createBuilding(
            scene,
            sample.position.add(side.scale(-(12 + Math.random() * 8))),
            neonColors,
            buildingId++
          );
          createBuilding(
            scene,
            sample.position.add(side.scale(12 + Math.random() * 8)),
            neonColors,
            buildingId++
          );
        }

        // --- Pilotos ---
        // Opção C: mesma física, mas IA humana (alivia curva + erra direção)
        function makeRacer(id, name, bodyColor, accentColor, isPlayer, aiStyle) {
          return {
            id,
            name,
            isPlayer,
            mesh: createCar(scene, id, bodyColor, accentColor),
            speed: 0,
            progress: 0,
            finished: false,
            finishTime: null,
            preferredLane: aiStyle ? aiStyle.preferredLane : 0,
            lookAhead: aiStyle ? aiStyle.lookAhead : 0,
            steerDeadzone: aiStyle ? aiStyle.steerDeadzone : 0.08,
            // Quanto antes alivia o acelerador na curva (maior = mais cauteloso)
            curveCaution: aiStyle ? aiStyle.curveCaution : 0,
            // Oscilação da faixa (parece pessoa corrigindo a linha)
            wobbleAmount: aiStyle ? aiStyle.wobbleAmount : 0,
            wobbleSpeed: aiStyle ? aiStyle.wobbleSpeed : 0,
            wobblePhase: aiStyle ? aiStyle.wobblePhase : 0,
            mistakeTimer: 0,
            mistakeChance: aiStyle ? aiStyle.mistakeChance : 0,
          };
        }

        const player = makeRacer(
          "player",
          "Você",
          new BABYLON.Color3(0.15, 0.75, 1),
          new BABYLON.Color3(1, 0.2, 0.85),
          true,
          null
        );

        // Nova: mais agressiva, erra mais
        const rivalA = makeRacer(
          "rivalA",
          "Nova",
          new BABYLON.Color3(1, 0.35, 0.15),
          new BABYLON.Color3(1, 0.85, 0.2),
          false,
          {
            preferredLane: -2.4,
            lookAhead: 16,
            steerDeadzone: 0.16,
            curveCaution: 0.12,
            wobbleAmount: 1.4,
            wobbleSpeed: 1.7,
            wobblePhase: 0.4,
            mistakeChance: 0.012,
          }
        );

        // Echo: um pouco mais seguro, ainda humano
        const rivalB = makeRacer(
          "rivalB",
          "Echo",
          new BABYLON.Color3(0.55, 0.25, 1),
          new BABYLON.Color3(0.3, 1, 0.7),
          false,
          {
            preferredLane: 2.4,
            lookAhead: 20,
            steerDeadzone: 0.14,
            curveCaution: 0.2,
            wobbleAmount: 0.9,
            wobbleSpeed: 1.2,
            wobblePhase: 2.1,
            mistakeChance: 0.008,
          }
        );

        const racers = [player, rivalA, rivalB];

        const camera = new BABYLON.FollowCamera(
          "marioKartCam",
          new BABYLON.Vector3(0, 12, -16),
          scene,
          player.mesh
        );
        camera.radius = 14;
        camera.heightOffset = 10;
        camera.rotationOffset = 180;
        camera.cameraAcceleration = 0.05;
        camera.maxCameraSpeed = 20;
        camera.inputs.clear();

        let raceTime = 0;
        let raceOver = false;
        let waitingForStart = false;
        let countdownActive = false;
        let countdownTimer = 0;
        let countdownStep = 0; // 0=3, 1=2, 2=1
        let goDisplayTimer = 0;
        const countdownLabels = ["3", "2", "1"];

        function placeRacer(racer, distance, lateral) {
          const sample = samplePath(path3D, Math.max(0, distance));
          const pos = sample.position.add(sample.binormal.scale(lateral));
          racer.mesh.position.copyFrom(pos);
          racer.mesh.position.y = 0;
          racer.mesh.rotation.y = Math.atan2(sample.tangent.x, sample.tangent.z);
          racer.mesh.rotation.z = 0;
          racer.speed = 0;
          racer.progress = path3D.getClosestPositionTo(racer.mesh.position);
          racer.finished = false;
          racer.finishTime = null;
        }

        function showReadyScreen() {
          waitingForStart = true;
          countdownActive = false;
          goDisplayTimer = 0;
          countdownNumber.classList.add("ready");
          countdownNumber.innerHTML =
            "Pressione qualquer tecla<br>para largar";
          countdownOverlay.classList.add("show");
        }

        function startCountdown() {
          waitingForStart = false;
          countdownActive = true;
          countdownTimer = 0;
          countdownStep = 0;
          goDisplayTimer = 0;
          countdownNumber.classList.remove("ready");
          countdownNumber.textContent = countdownLabels[0];
          countdownOverlay.classList.add("show");
        }

        function resetRace() {
          raceTime = 0;
          raceOver = false;
          // Largada justa: todos alinhados na mesma linha
          placeRacer(player, 0, 0);
          placeRacer(rivalA, 0, -2.4);
          placeRacer(rivalB, 0, 2.4);
          finishOverlay.classList.remove("show");
          progressLabel.textContent = "Progresso: 0%";
          placeLabel.textContent = "Posição: 1º / 3";
          speedLabel.textContent = "Velocidade: 0";
          showReadyScreen();
        }

        window.addEventListener("keydown", (e) => {
          if (waitingForStart) {
            e.preventDefault();
            startCountdown();
            return;
          }
          if (e.code === "KeyR" && raceOver) {
            resetRace();
          }
        });

        resetRace();

        function getAIInput(racer, dt) {
          if (racer.finished) {
            return { up: false, down: false, left: false, right: false };
          }

          const t = path3D.getClosestPositionTo(racer.mesh.position);
          const lookT = Math.min(1, t + racer.lookAhead / trackLength);

          // Quão fechada é a curva à frente (0 = reta, maior = curva)
          const tanNow = path3D.getTangentAt(t).normalize();
          const tanAhead = path3D.getTangentAt(lookT).normalize();
          const bend = 1 - BABYLON.Vector3.Dot(tanNow, tanAhead);

          const laneOffset =
            racer.preferredLane +
            Math.sin(raceTime * racer.wobbleSpeed + racer.wobblePhase) *
              racer.wobbleAmount;

          const target = path3D
            .getPointAt(lookT)
            .add(path3D.getBinormalAt(lookT).normalize().scale(laneOffset));

          const toTarget = target.subtract(racer.mesh.position);
          const desiredYaw = Math.atan2(toTarget.x, toTarget.z);
          let yawError = normalizeAngle(desiredYaw - racer.mesh.rotation.y);

          // Erros curtos de direção (hesitação / correção atrasada)
          if (racer.mistakeTimer > 0) {
            racer.mistakeTimer -= dt;
            yawError *= -0.35; // vira um pouco para o lado errado
          } else if (Math.random() < racer.mistakeChance) {
            racer.mistakeTimer = 0.2 + Math.random() * 0.25;
          }

          let left = yawError < -racer.steerDeadzone;
          let right = yawError > racer.steerDeadzone;

          // Alivia acelerador nas curvas ou quando está desalinhado
          const sharpCurve = bend > racer.curveCaution;
          const badlyAligned = Math.abs(yawError) > 0.55;
          const up = !sharpCurve && !badlyAligned;
          const down = sharpCurve && bend > racer.curveCaution + 0.08;

          return { up, down, left, right };
        }

        function applyDrive(racer, input, dt) {
          if (racer.finished) {
            racer.speed = 0;
            return;
          }

          // Mesma aceleração / freio / atrito do jogador
          if (input.up) {
            racer.speed += PHYSICS.accel * dt;
          } else if (input.down) {
            racer.speed -= PHYSICS.brake * dt;
          } else {
            if (racer.speed > 0) racer.speed -= PHYSICS.friction * dt;
            else if (racer.speed < 0) racer.speed += PHYSICS.friction * dt;
            if (Math.abs(racer.speed) < 0.2) racer.speed = 0;
          }

          racer.speed = Math.max(-12, Math.min(PHYSICS.maxSpeed, racer.speed));

          const steerPower = Math.min(1, Math.abs(racer.speed) / 10);
          if (input.left) racer.mesh.rotation.y -= PHYSICS.turnRate * steerPower * dt;
          if (input.right) racer.mesh.rotation.y += PHYSICS.turnRate * steerPower * dt;

          let targetRoll = 0;
          if (input.left) targetRoll = 0.18;
          if (input.right) targetRoll = -0.18;
          racer.mesh.rotation.z +=
            (targetRoll - racer.mesh.rotation.z) * Math.min(1, 8 * dt);

          const forward = new BABYLON.Vector3(
            Math.sin(racer.mesh.rotation.y),
            0,
            Math.cos(racer.mesh.rotation.y)
          );
          racer.mesh.position.addInPlace(forward.scale(racer.speed * dt));
          racer.mesh.position.y = 0;

          const t = path3D.getClosestPositionTo(racer.mesh.position);
          const closest = path3D.getPointAt(t);
          const binormal = path3D.getBinormalAt(t).normalize();
          const lateral = BABYLON.Vector3.Dot(
            racer.mesh.position.subtract(closest),
            binormal
          );

          if (Math.abs(lateral) > PHYSICS.laneLimit) {
            const excess = Math.abs(lateral) - PHYSICS.laneLimit;
            racer.mesh.position.addInPlace(
              binormal.scale(-Math.sign(lateral) * excess)
            );
            racer.speed *= 0.97;
          }

          racer.progress = path3D.getClosestPositionTo(racer.mesh.position);

          const distToFinish = BABYLON.Vector3.Distance(
            racer.mesh.position,
            finishSample.position
          );
          if (racer.progress > 0.97 && distToFinish < 10) {
            racer.finished = true;
            racer.finishTime = raceTime;
            racer.speed = 0;
            racer.progress = 1;
          }
        }

        function getPlayerPlace() {
          let place = 1;
          for (const other of racers) {
            if (other === player) continue;
            if (other.finished && player.finished) {
              if (other.finishTime < player.finishTime) place += 1;
            } else if (other.finished && !player.finished) {
              place += 1;
            } else if (!other.finished && !player.finished) {
              if (other.progress > player.progress + 0.001) place += 1;
            }
          }
          return place;
        }

        function placeText(place) {
          return place + "º";
        }

        scene.onBeforeRenderObservable.add(() => {
          const dt = engine.getDeltaTime() / 1000;

          if (raceOver) {
            speedLabel.textContent = "Velocidade: 0";
            return;
          }

          // Esperando tecla ou contagem: ninguém anda
          if (waitingForStart || countdownActive) {
            if (countdownActive) {
              countdownTimer += dt;
              if (countdownTimer >= 1) {
                countdownTimer = 0;
                countdownStep += 1;
                if (countdownStep >= countdownLabels.length) {
                  countdownActive = false;
                  countdownNumber.textContent = "VAI!";
                  goDisplayTimer = 0.7;
                } else {
                  countdownNumber.textContent = countdownLabels[countdownStep];
                }
              }
            }
            return;
          }

          if (goDisplayTimer > 0) {
            goDisplayTimer -= dt;
            if (goDisplayTimer <= 0) {
              countdownOverlay.classList.remove("show");
            }
          }

          raceTime += dt;

          applyDrive(player, keys, dt);
          applyDrive(rivalA, getAIInput(rivalA, dt), dt);
          applyDrive(rivalB, getAIInput(rivalB, dt), dt);

          const place = getPlayerPlace();
          placeLabel.textContent = "Posição: " + placeText(place) + " / 3";

          const progress = Math.floor(player.progress * 100);
          speedLabel.textContent =
            "Velocidade: " + Math.round(Math.abs(player.speed));
          if (!player.finished) {
            progressLabel.textContent =
              "Progresso: " + Math.max(0, Math.min(99, progress)) + "%";
          }

          if (player.finished) {
            raceOver = true;
            const finalPlace = getPlayerPlace();
            progressLabel.textContent = "Progresso: 100%";
            placeLabel.textContent = "Posição: " + placeText(finalPlace) + " / 3";
            finishTitle.textContent =
              finalPlace === 1 ? "VENCEU!" : "CHEGOU!";
            finishPlace.textContent =
              "Você ficou em " + placeText(finalPlace);
            finishTime.textContent = "Tempo: " + raceTime.toFixed(1) + "s";
            finishOverlay.classList.add("show");
          }
        });

        return scene;
      };

      const scene = createScene();

      engine.runRenderLoop(function () {
        scene.render();
      });

      window.addEventListener("resize", function () {
        engine.resize();
      });
    </script>
  </body>
</html>
