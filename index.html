<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Neon Rush — Luigi</title>
    <style>
      html,
      body {
        overflow: hidden;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #05010f;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }

      #renderCanvas {
        width: 100%;
        height: 100%;
        touch-action: none;
        display: block;
      }

      #hud {
        display: none;
        position: fixed;
        left: 16px;
        top: 16px;
        color: #b8f3ff;
        text-shadow: 0 0 8px #00e5ff;
        pointer-events: none;
        user-select: none;
        z-index: 2;
      }

      #hud.show {
        display: block;
      }

      /* Hub estilo Brawl Stars / Stumble Guys: carro no centro */
      #mainMenu {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        background: radial-gradient(
          ellipse 55% 50% at 50% 55%,
          transparent 0%,
          rgba(5, 1, 20, 0.15) 55%,
          rgba(5, 1, 20, 0.55) 100%
        );
      }

      #mainMenu.show {
        display: block;
      }

      #mainMenu .hit {
        pointer-events: auto;
      }

      .menu-brand {
        position: absolute;
        top: 18px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        pointer-events: none;
      }

      .menu-brand h1 {
        margin: 0;
        font-size: clamp(28px, 6vw, 48px);
        letter-spacing: 6px;
        color: #ff4fd8;
        text-shadow: 0 0 18px #ff4fd8, 0 0 36px #00e5ff;
      }

      .menu-brand p {
        margin: 4px 0 0;
        font-size: 12px;
        letter-spacing: 3px;
        color: #b8f3ff;
        text-shadow: 0 0 8px #00e5ff;
      }

      .menu-rail {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 86px;
      }

      .menu-money {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        padding: 10px 8px;
        border: 2px solid #ffd24a;
        background: rgba(10, 4, 30, 0.82);
        box-shadow: 0 0 14px rgba(255, 210, 74, 0.25);
        color: #ffe79a;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .menu-money span {
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 1px;
        opacity: 0.85;
      }

      .rail-btn {
        appearance: none;
        width: 100%;
        min-height: 72px;
        padding: 8px 6px;
        border: 2px solid #00e5ff;
        background: rgba(10, 4, 30, 0.82);
        color: #b8f3ff;
        font-size: 11px;
        letter-spacing: 1px;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        text-shadow: 0 0 8px #00e5ff;
        transition: background 0.15s ease, box-shadow 0.15s ease,
          transform 0.15s ease;
      }

      .rail-btn .icon {
        font-size: 22px;
        line-height: 1;
      }

      .rail-btn:hover:not(:disabled),
      .rail-btn:focus-visible:not(:disabled) {
        background: rgba(0, 229, 255, 0.18);
        box-shadow: 0 0 16px rgba(0, 229, 255, 0.3);
        outline: none;
      }

      .rail-btn:disabled {
        opacity: 0.4;
        cursor: default;
        border-color: #556;
        color: #99a;
        text-shadow: none;
      }

      .menu-play-wrap {
        position: absolute;
        right: 18px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        width: min(200px, 42vw);
      }

      .play-btn {
        appearance: none;
        border: 3px solid #39ff9f;
        background: linear-gradient(
          180deg,
          rgba(57, 255, 159, 0.35),
          rgba(20, 120, 80, 0.55)
        );
        color: #eafff4;
        font-size: clamp(22px, 4vw, 30px);
        font-weight: 800;
        letter-spacing: 3px;
        padding: 22px 18px;
        cursor: pointer;
        text-shadow: 0 0 12px rgba(57, 255, 159, 0.8);
        box-shadow: 0 0 28px rgba(57, 255, 159, 0.35);
        transition: transform 0.15s ease, box-shadow 0.15s ease;
      }

      .play-btn:hover,
      .play-btn:focus-visible {
        transform: scale(1.04);
        box-shadow: 0 0 36px rgba(57, 255, 159, 0.5);
        outline: none;
      }

      .play-btn:active {
        transform: scale(0.98);
      }

      .menu-hint {
        text-align: center;
        font-size: 11px;
        color: #b8f3ff;
        opacity: 0.75;
        pointer-events: none;
      }

      @media (max-width: 640px) {
        .menu-rail {
          width: 70px;
          left: 8px;
        }

        .menu-play-wrap {
          right: 8px;
          width: min(150px, 40vw);
        }

        .play-btn {
          padding: 16px 10px;
          letter-spacing: 2px;
        }
      }

      #hud h1 {
        margin: 0 0 6px;
        font-size: 22px;
        letter-spacing: 2px;
        color: #ff4fd8;
        text-shadow: 0 0 10px #ff4fd8;
      }

      #hud p {
        margin: 0;
        font-size: 14px;
        opacity: 0.9;
      }

      #rankingPanel {
        display: none;
        position: fixed;
        right: 16px;
        top: 16px;
        z-index: 3;
        min-width: 260px;
        padding: 14px 16px 12px;
        border: 2px solid #ff4fd8;
        box-shadow: 0 0 24px rgba(255, 79, 216, 0.35);
        background: rgba(10, 4, 30, 0.88);
        color: #fff;
        pointer-events: none;
        user-select: none;
      }

      #rankingPanel.show {
        display: block;
      }

      #rankingPanel h2 {
        margin: 0 0 10px;
        font-size: 18px;
        letter-spacing: 2px;
        color: #ff4fd8;
        text-shadow: 0 0 10px #ff4fd8;
      }

      .ranking-row {
        display: grid;
        grid-template-columns: 36px 1fr 64px;
        gap: 8px;
        align-items: center;
        padding: 6px 4px;
        font-size: 14px;
        color: #b8f3ff;
        border-top: 1px solid rgba(184, 243, 255, 0.15);
      }

      .ranking-row.you {
        color: #fff;
        text-shadow: 0 0 8px #00e5ff;
      }

      .ranking-row.pending {
        opacity: 0.45;
      }

      .ranking-row .pos {
        font-weight: 700;
        color: #ff4fd8;
      }

      .ranking-row .time {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      #rankingHint {
        display: none;
        margin: 12px 0 0;
        font-size: 13px;
        color: #b8f3ff;
        text-align: center;
      }

      #rankingHint.show {
        display: block;
      }

      #countdownOverlay {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 4;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        background: rgba(5, 1, 20, 0.35);
      }

      #countdownOverlay.show {
        display: flex;
      }

      #countdownNumber {
        font-size: 120px;
        font-weight: 700;
        letter-spacing: 8px;
        color: #ff4fd8;
        text-shadow: 0 0 28px #ff4fd8, 0 0 60px #00e5ff;
        text-align: center;
      }

      #debugFps {
        display: none;
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 20;
        padding: 6px 10px;
        border: 1px solid #39ff9f;
        background: rgba(5, 1, 20, 0.85);
        color: #39ff9f;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
        letter-spacing: 1px;
        pointer-events: none;
        user-select: none;
      }

      #debugFps.show {
        display: block;
      }

    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="tracks/neon-circuit-1.js"></script>
    <script src="audio.js"></script>
  </head>
  <body>
    <div id="mainMenu" class="show">
      <div class="menu-brand">
        <h1>NEON RUSH</h1>
        <p>CORRIDA FUTURISTA</p>
      </div>

      <aside class="menu-rail hit" aria-label="Opções">
        <div class="menu-money" title="Moedas">
          <span>MOEDAS</span>
          <strong id="moneyLabel">0</strong>
        </div>
        <button type="button" class="rail-btn" disabled title="Em breve">
          <span class="icon">▣</span>
          Loja
        </button>
        <button type="button" class="rail-btn" disabled title="Em breve">
          <span class="icon">▣</span>
          Garagem
        </button>
      </aside>

      <div class="menu-play-wrap hit">
        <button type="button" class="play-btn" id="btnStartRace">JOGAR</button>
      </div>
    </div>
    <div id="hud">
      <h1>NEON RUSH</h1>
      <p>↑ acelerar · ↓ frear · ← → virar</p>
      <p id="speedLabel">Velocidade: 0</p>
      <p id="progressLabel">Progresso: 0%</p>
      <p id="placeLabel">Posição: 1º / 3</p>
    </div>
    <div id="countdownOverlay">
      <div id="countdownNumber">3</div>
    </div>
    <div id="rankingPanel">
      <h2>RANKING</h2>
      <div id="rankingList"></div>
      <p id="rankingHint">Pressione R para voltar ao menu</p>
    </div>
    <div id="debugFps">-- FPS</div>
    <canvas id="renderCanvas"></canvas>
    <script>
      const canvas = document.getElementById("renderCanvas");
      const speedLabel = document.getElementById("speedLabel");
      const progressLabel = document.getElementById("progressLabel");
      const placeLabel = document.getElementById("placeLabel");
      const mainMenu = document.getElementById("mainMenu");
      const btnStartRace = document.getElementById("btnStartRace");
      const hud = document.getElementById("hud");
      const rankingPanel = document.getElementById("rankingPanel");
      const rankingList = document.getElementById("rankingList");
      const rankingHint = document.getElementById("rankingHint");
      const countdownOverlay = document.getElementById("countdownOverlay");
      const countdownNumber = document.getElementById("countdownNumber");
      const moneyLabel = document.getElementById("moneyLabel");
      const debugFps = document.getElementById("debugFps");
      const engine = new BABYLON.Engine(canvas, true);

      const debugEnabled =
        new URLSearchParams(window.location.search).get("debug") === "true";
      if (debugEnabled) {
        debugFps.classList.add("show");
      }
      let debugFpsFrame = 0;

      // Economia: começa em 0; 1º=+11, 2º=+7, 3º=+0
      const COIN_REWARDS = { 1: 11, 2: 7, 3: 0 };
      const COINS_STORAGE_KEY = "neonRush.coins";

      function loadCoins() {
        const saved = localStorage.getItem(COINS_STORAGE_KEY);
        const value = saved === null ? 0 : parseInt(saved, 10);
        return Number.isFinite(value) && value >= 0 ? value : 0;
      }

      function saveCoins(amount) {
        localStorage.setItem(COINS_STORAGE_KEY, String(amount));
      }

      let coins = loadCoins();

      function refreshMoneyLabel() {
        moneyLabel.textContent = String(coins);
      }

      function rewardCoinsForPlace(place) {
        const gained = COIN_REWARDS[place] || 0;
        if (gained > 0) {
          coins += gained;
          saveCoins(coins);
          refreshMoneyLabel();
        }
        return gained;
      }

      refreshMoneyLabel();

      // Física IGUAL para jogador e rivais (sem vantagem)
      const PHYSICS = {
        maxSpeed: 55,
        accel: 28,
        brake: 40,
        friction: 10,
        turnRate: 1.2,
        laneLimit: 5.5,
      };

      const keys = {
        up: false,
        down: false,
        left: false,
        right: false,
      };

      window.addEventListener("keydown", (e) => {
        if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = true;
        if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = true;
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
      });

      window.addEventListener("keyup", (e) => {
        if (e.code === "ArrowUp" || e.code === "KeyW") keys.up = false;
        if (e.code === "ArrowDown" || e.code === "KeyS") keys.down = false;
        if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
        if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
      });

      function makeNeonMaterial(name, scene, color, glow = 0.85) {
        const mat = new BABYLON.StandardMaterial(name, scene);
        mat.diffuseColor = color.scale(0.25);
        mat.emissiveColor = color.scale(glow);
        mat.specularColor = new BABYLON.Color3(0.2, 0.2, 0.3);
        return mat;
      }

      function createCar(scene, id, bodyColor, accentColor) {
        // Carro base mais “real”: carroceria, vidros, portas e rodas
        const car = new BABYLON.TransformNode("car_" + id, scene);

        const bodyMat = new BABYLON.StandardMaterial("bodyMat_" + id, scene);
        bodyMat.diffuseColor = bodyColor.scale(0.55);
        bodyMat.emissiveColor = bodyColor.scale(0.22);
        bodyMat.specularColor = new BABYLON.Color3(0.35, 0.35, 0.4);

        const accentMat = makeNeonMaterial(
          "accentMat_" + id,
          scene,
          accentColor,
          0.75
        );

        const glassMat = new BABYLON.StandardMaterial("glassMat_" + id, scene);
        glassMat.diffuseColor = new BABYLON.Color3(0.15, 0.25, 0.35);
        glassMat.emissiveColor = new BABYLON.Color3(0.12, 0.28, 0.4);
        glassMat.alpha = 0.55;
        glassMat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;
        glassMat.backFaceCulling = false;

        const darkMat = new BABYLON.StandardMaterial("darkMat_" + id, scene);
        darkMat.diffuseColor = new BABYLON.Color3(0.08, 0.08, 0.1);
        darkMat.emissiveColor = new BABYLON.Color3(0.02, 0.02, 0.03);

        const doorMat = new BABYLON.StandardMaterial("doorMat_" + id, scene);
        doorMat.diffuseColor = bodyColor.scale(0.4);
        doorMat.emissiveColor = bodyColor.scale(0.12);

        // Chassis / carroceria
        const body = BABYLON.MeshBuilder.CreateBox(
          "body_" + id,
          { width: 1.75, height: 0.42, depth: 3.5 },
          scene
        );
        body.position.y = 0.52;
        body.material = bodyMat;
        body.parent = car;

        // Capô um pouco mais baixo na frente
        const hood = BABYLON.MeshBuilder.CreateBox(
          "hood_" + id,
          { width: 1.55, height: 0.16, depth: 0.95 },
          scene
        );
        hood.position.set(0, 0.68, 1.15);
        hood.material = bodyMat;
        hood.parent = car;

        // Porta-malas
        const trunk = BABYLON.MeshBuilder.CreateBox(
          "trunk_" + id,
          { width: 1.55, height: 0.2, depth: 0.7 },
          scene
        );
        trunk.position.set(0, 0.7, -1.35);
        trunk.material = bodyMat;
        trunk.parent = car;

        // Cabine (estrutura)
        const cabin = BABYLON.MeshBuilder.CreateBox(
          "cabin_" + id,
          { width: 1.55, height: 0.5, depth: 1.55 },
          scene
        );
        cabin.position.set(0, 0.95, -0.15);
        cabin.material = darkMat;
        cabin.parent = car;

        // Vidros (parabrisas / laterais / traseiro)
        const windshield = BABYLON.MeshBuilder.CreateBox(
          "windshield_" + id,
          { width: 1.4, height: 0.38, depth: 0.08 },
          scene
        );
        windshield.position.set(0, 0.98, 0.58);
        windshield.rotation.x = -0.35;
        windshield.material = glassMat;
        windshield.parent = car;

        const rearGlass = BABYLON.MeshBuilder.CreateBox(
          "rearGlass_" + id,
          { width: 1.35, height: 0.34, depth: 0.08 },
          scene
        );
        rearGlass.position.set(0, 0.96, -0.88);
        rearGlass.rotation.x = 0.28;
        rearGlass.material = glassMat;
        rearGlass.parent = car;

        const sideGlassL = BABYLON.MeshBuilder.CreateBox(
          "sideGlassL_" + id,
          { width: 0.06, height: 0.32, depth: 1.2 },
          scene
        );
        sideGlassL.position.set(-0.78, 0.98, -0.1);
        sideGlassL.material = glassMat;
        sideGlassL.parent = car;

        const sideGlassR = sideGlassL.clone("sideGlassR_" + id);
        sideGlassR.position.x = 0.78;
        sideGlassR.parent = car;

        // Portas (painéis laterais)
        const doorL = BABYLON.MeshBuilder.CreateBox(
          "doorL_" + id,
          { width: 0.06, height: 0.36, depth: 1.15 },
          scene
        );
        doorL.position.set(-0.9, 0.55, 0.05);
        doorL.material = doorMat;
        doorL.parent = car;

        const doorR = doorL.clone("doorR_" + id);
        doorR.position.x = 0.9;
        doorR.parent = car;

        // Maçanetas
        const handleL = BABYLON.MeshBuilder.CreateBox(
          "handleL_" + id,
          { width: 0.05, height: 0.05, depth: 0.18 },
          scene
        );
        handleL.position.set(-0.94, 0.58, 0.25);
        handleL.material = accentMat;
        handleL.parent = car;

        const handleR = handleL.clone("handleR_" + id);
        handleR.position.x = 0.94;
        handleR.parent = car;

        // Faróis
        const headL = BABYLON.MeshBuilder.CreateBox(
          "headL_" + id,
          { width: 0.35, height: 0.14, depth: 0.08 },
          scene
        );
        headL.position.set(-0.55, 0.5, 1.76);
        headL.material = accentMat;
        headL.parent = car;

        const headR = headL.clone("headR_" + id);
        headR.position.x = 0.55;
        headR.parent = car;

        // Rodas
        function addWheel(name, x, z) {
          const wheel = BABYLON.MeshBuilder.CreateCylinder(
            name,
            { diameter: 0.58, height: 0.28, tessellation: 16 },
            scene
          );
          wheel.rotation.z = Math.PI / 2;
          wheel.position.set(x, 0.29, z);
          wheel.material = darkMat;
          wheel.parent = car;

          const hub = BABYLON.MeshBuilder.CreateCylinder(
            name + "_hub",
            { diameter: 0.22, height: 0.3, tessellation: 12 },
            scene
          );
          hub.rotation.z = Math.PI / 2;
          hub.position.set(x, 0.29, z);
          hub.material = accentMat;
          hub.parent = car;
        }

        addWheel("wheelFL_" + id, -0.85, 1.15);
        addWheel("wheelFR_" + id, 0.85, 1.15);
        addWheel("wheelBL_" + id, -0.85, -1.15);
        addWheel("wheelBR_" + id, 0.85, -1.15);

        return car;
      }

      function getActiveTrackData() {
        const id = window.NEON_RUSH_ACTIVE_TRACK;
        const data = window.NEON_RUSH_TRACKS && window.NEON_RUSH_TRACKS[id];
        if (!data) {
          throw new Error("Pista não encontrada: " + id);
        }
        return data;
      }

      function buildTrackFromData(trackData) {
        const controls = trackData.controlPoints.map(function (p) {
          return new BABYLON.Vector3(p[0], p[1], p[2]);
        });
        const curve = BABYLON.Curve3.CreateCatmullRomSpline(controls, 25, false);
        const path3D = new BABYLON.Path3D(
          curve.getPoints(),
          new BABYLON.Vector3(0, 1, 0)
        );

        const startPos = new BABYLON.Vector3(
          trackData.startPoint[0],
          trackData.startPoint[1],
          trackData.startPoint[2]
        );
        const finishPos = new BABYLON.Vector3(
          trackData.finishPoint[0],
          trackData.finishPoint[1],
          trackData.finishPoint[2]
        );

        const startDist = path3D.getDistanceAt(
          path3D.getClosestPositionTo(startPos)
        );
        const finishDist = path3D.getDistanceAt(
          path3D.getClosestPositionTo(finishPos)
        );

        return {
          data: trackData,
          path3D: path3D,
          trackLength: path3D.length(),
          startDist: startDist,
          finishDist: finishDist,
          raceLength: Math.max(1, finishDist - startDist),
        };
      }

      function samplePath(path3D, distance) {
        const total = path3D.length();
        const t = Math.max(0, Math.min(1, distance / total));
        return {
          total,
          t,
          position: path3D.getPointAt(t),
          tangent: path3D.getTangentAt(t).normalize(),
          normal: path3D.getNormalAt(t).normalize(),
          binormal: path3D.getBinormalAt(t).normalize(),
        };
      }

      function distanceAlongPath(path3D, worldPos) {
        return path3D.getDistanceAt(path3D.getClosestPositionTo(worldPos));
      }

      function raceProgressFromDistance(distAlong, track) {
        return Math.max(
          0,
          Math.min(1, (distAlong - track.startDist) / track.raceLength)
        );
      }

      function createRoadPiece(scene, sample, roadMat, edgeMat, index) {
        const pieceLength = 8;
        const group = new BABYLON.TransformNode("roadPiece_" + index, scene);
        group.position.copyFrom(sample.position);
        group.rotation.y = Math.atan2(sample.tangent.x, sample.tangent.z);

        const road = BABYLON.MeshBuilder.CreateGround(
          "road_" + index,
          { width: 14, height: pieceLength },
          scene
        );
        road.material = roadMat;
        road.parent = group;

        const leftEdge = BABYLON.MeshBuilder.CreateBox(
          "leftEdge_" + index,
          { width: 0.25, height: 0.2, depth: pieceLength },
          scene
        );
        leftEdge.position.set(-7, 0.1, 0);
        leftEdge.material = edgeMat;
        leftEdge.parent = group;

        const rightEdge = BABYLON.MeshBuilder.CreateBox(
          "rightEdge_" + index,
          { width: 0.25, height: 0.2, depth: pieceLength },
          scene
        );
        rightEdge.position.set(7, 0.1, 0);
        rightEdge.material = edgeMat;
        rightEdge.parent = group;

        const dash = BABYLON.MeshBuilder.CreateBox(
          "dash_" + index,
          { width: 0.2, height: 0.05, depth: 3 },
          scene
        );
        dash.position.set(0, 0.03, 0);
        dash.material = edgeMat;
        dash.parent = group;

        return group;
      }

      function createFinishLine(scene, sample) {
        const gate = new BABYLON.TransformNode("finishGate", scene);
        gate.position.copyFrom(sample.position);
        gate.rotation.y = Math.atan2(sample.tangent.x, sample.tangent.z);

        const pink = makeNeonMaterial(
          "finishPink",
          scene,
          new BABYLON.Color3(1, 0.2, 0.85),
          1
        );
        const cyan = makeNeonMaterial(
          "finishCyan",
          scene,
          new BABYLON.Color3(0.2, 0.95, 1),
          1
        );
        const white = makeNeonMaterial(
          "finishWhite",
          scene,
          new BABYLON.Color3(1, 1, 1),
          0.9
        );

        const leftPost = BABYLON.MeshBuilder.CreateBox(
          "leftPost",
          { width: 0.4, height: 6, depth: 0.4 },
          scene
        );
        leftPost.position.set(-7, 3, 0);
        leftPost.material = pink;
        leftPost.parent = gate;

        const rightPost = BABYLON.MeshBuilder.CreateBox(
          "rightPost",
          { width: 0.4, height: 6, depth: 0.4 },
          scene
        );
        rightPost.position.set(7, 3, 0);
        rightPost.material = cyan;
        rightPost.parent = gate;

        // Faixa com texto FINISH (frente e verso)
        const finishTex = new BABYLON.DynamicTexture(
          "finishText",
          { width: 1024, height: 256 },
          scene,
          false
        );
        finishTex.hasAlpha = true;
        const ctx = finishTex.getContext();
        ctx.clearRect(0, 0, 1024, 256);
        ctx.fillStyle = "#1a0428";
        ctx.fillRect(0, 0, 1024, 256);
        ctx.strokeStyle = "#ff4fd8";
        ctx.lineWidth = 10;
        ctx.strokeRect(12, 12, 1000, 232);
        finishTex.update();
        finishTex.drawText(
          "FINISH",
          null,
          170,
          "bold 140px Segoe UI, Arial",
          "#b8f3ff",
          null,
          true
        );

        const bannerMat = new BABYLON.StandardMaterial("finishBannerMat", scene);
        bannerMat.diffuseTexture = finishTex;
        bannerMat.emissiveTexture = finishTex;
        bannerMat.emissiveColor = new BABYLON.Color3(0.7, 0.7, 0.7);
        bannerMat.backFaceCulling = false;

        const banner = BABYLON.MeshBuilder.CreatePlane(
          "finishBanner",
          { width: 12, height: 1.6 },
          scene
        );
        banner.position.set(0, 5.4, 0);
        banner.material = bannerMat;
        banner.parent = gate;

        const bannerBack = banner.clone("finishBannerBack");
        bannerBack.rotation.y = Math.PI;
        bannerBack.parent = gate;

        for (let i = 0; i < 8; i++) {
          const stripe = BABYLON.MeshBuilder.CreateBox(
            "finishStripe_" + i,
            { width: 1.6, height: 0.06, depth: 1.2 },
            scene
          );
          stripe.position.set(-6.3 + i * 1.8, 0.04, 0);
          stripe.material = i % 2 === 0 ? white : pink;
          stripe.parent = gate;
        }

        return gate;
      }

      function createBuilding(scene, position, neonColors, id) {
        const height = 6 + Math.random() * 18;
        const width = 3 + Math.random() * 3;
        const depth = 3 + Math.random() * 3;
        const group = new BABYLON.TransformNode("buildingGroup_" + id, scene);
        group.position.copyFrom(position);

        const building = BABYLON.MeshBuilder.CreateBox(
          "building_" + id,
          { width, height, depth },
          scene
        );
        building.position.y = height / 2;
        building.parent = group;

        const color = neonColors[Math.floor(Math.random() * neonColors.length)];
        const mat = new BABYLON.StandardMaterial("buildMat_" + id, scene);
        mat.diffuseColor = new BABYLON.Color3(0.04, 0.04, 0.08);
        mat.emissiveColor = color.scale(0.08);
        building.material = mat;

        const glassMat = new BABYLON.StandardMaterial("winMat_" + id, scene);
        glassMat.diffuseColor = new BABYLON.Color3(0.1, 0.2, 0.3);
        glassMat.emissiveColor = color.scale(0.55 + Math.random() * 0.35);
        glassMat.alpha = 0.85;
        glassMat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;

        const doorMat = new BABYLON.StandardMaterial("doorMat_" + id, scene);
        doorMat.diffuseColor = new BABYLON.Color3(0.05, 0.08, 0.12);
        doorMat.emissiveColor = new BABYLON.Color3(0.15, 0.35, 0.45);
        doorMat.alpha = 0.9;
        doorMat.transparencyMode = BABYLON.Material.MATERIAL_ALPHABLEND;

        // Janelas nas 4 faces + porta de vidro na face frontal (Z+)
        const faces = [
          { axis: "x", sign: -1, w: depth, d: width },
          { axis: "x", sign: 1, w: depth, d: width },
          { axis: "z", sign: -1, w: width, d: depth },
          { axis: "z", sign: 1, w: width, d: depth },
        ];

        let winId = 0;
        faces.forEach(function (face, faceIndex) {
          const cols = 2 + Math.floor(Math.random() * 2);
          const rows = Math.max(2, Math.floor(height / 2.2));
          const faceWidth = face.axis === "x" ? depth : width;
          const inset = (face.axis === "x" ? width : depth) / 2 + 0.03;

          for (let row = 0; row < rows; row++) {
            for (let col = 0; col < cols; col++) {
              const isDoor =
                faceIndex === 3 && row === 0 && col === Math.floor(cols / 2);
              const winW = faceWidth / (cols + 1) * 0.7;
              const winH = isDoor ? 1.4 : 0.7;
              const win = BABYLON.MeshBuilder.CreateBox(
                "win_" + id + "_" + winId++,
                {
                  width: face.axis === "z" ? winW : 0.06,
                  height: winH,
                  depth: face.axis === "x" ? winW : 0.06,
                },
                scene
              );

              const xSpread = faceWidth * 0.55;
              const along =
                -xSpread / 2 + ((col + 0.5) * xSpread) / cols;
              const y = isDoor ? winH / 2 + 0.05 : 1.6 + row * 1.8;

              if (face.axis === "x") {
                win.position.set(face.sign * inset, y, along);
              } else {
                win.position.set(along, y, face.sign * inset);
              }
              win.material = isDoor ? doorMat : glassMat;
              win.parent = group;
            }
          }
        });

        return group;
      }

      function normalizeAngle(angle) {
        while (angle > Math.PI) angle -= Math.PI * 2;
        while (angle < -Math.PI) angle += Math.PI * 2;
        return angle;
      }

      const createScene = function () {
        const scene = new BABYLON.Scene(engine);
        scene.clearColor = new BABYLON.Color4(0.02, 0.01, 0.08, 1);
        scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
        scene.fogDensity = 0.012;
        scene.fogColor = new BABYLON.Color3(0.04, 0.02, 0.1);

        const hemi = new BABYLON.HemisphericLight(
          "hemi",
          new BABYLON.Vector3(0, 1, 0),
          scene
        );
        hemi.intensity = 0.35;
        hemi.groundColor = new BABYLON.Color3(0.05, 0.02, 0.1);

        const neonColors = [
          new BABYLON.Color3(1, 0.2, 0.85),
          new BABYLON.Color3(0.2, 0.9, 1),
          new BABYLON.Color3(0.5, 0.3, 1),
          new BABYLON.Color3(1, 0.5, 0.2),
        ];

        const roadMat = new BABYLON.StandardMaterial("roadMat", scene);
        roadMat.diffuseColor = new BABYLON.Color3(0.04, 0.04, 0.08);
        roadMat.emissiveColor = new BABYLON.Color3(0.03, 0.03, 0.07);

        // Carrega o pacote de dados da pista ativa
        const track = buildTrackFromData(getActiveTrackData());
        const path3D = track.path3D;
        const trackLength = track.trackLength;

        const themeEdge = track.data.theme.edgeColor;
        const edgeMat = makeNeonMaterial(
          "edgeMat",
          scene,
          new BABYLON.Color3(themeEdge[0], themeEdge[1], themeEdge[2]),
          1
        );

        const themeRoad = track.data.theme.roadEmissive;
        roadMat.emissiveColor = new BABYLON.Color3(
          themeRoad[0],
          themeRoad[1],
          themeRoad[2]
        );

        const step = 7;
        let pieceIndex = 0;
        for (let d = 0; d < trackLength; d += step) {
          createRoadPiece(
            scene,
            samplePath(path3D, d),
            roadMat,
            edgeMat,
            pieceIndex++
          );
        }

        const finishSample = samplePath(path3D, track.finishDist);
        createFinishLine(scene, finishSample);

        let buildingId = 0;
        for (let d = 10; d < trackLength; d += 14) {
          const sample = samplePath(path3D, d);
          const side = sample.binormal;
          createBuilding(
            scene,
            sample.position.add(side.scale(-(12 + Math.random() * 8))),
            neonColors,
            buildingId++
          );
          createBuilding(
            scene,
            sample.position.add(side.scale(12 + Math.random() * 8)),
            neonColors,
            buildingId++
          );
        }

        // --- Pilotos ---
        // Opção C: mesma física, mas IA humana (alivia curva + erra direção)
        function makeRacer(id, name, bodyColor, accentColor, isPlayer, aiStyle) {
          return {
            id,
            name,
            isPlayer,
            mesh: createCar(scene, id, bodyColor, accentColor),
            speed: 0,
            progress: 0, // 0..1 só no trecho de corrida (largada → chegada)
            distAlong: 0,
            finished: false,
            finishTime: null,
            prevFinishSide: -1,
            preferredLane: aiStyle ? aiStyle.preferredLane : 0,
            lookAhead: aiStyle ? aiStyle.lookAhead : 0,
            steerDeadzone: aiStyle ? aiStyle.steerDeadzone : 0.08,
            // Quanto antes alivia o acelerador na curva (maior = mais cauteloso)
            curveCaution: aiStyle ? aiStyle.curveCaution : 0,
            // Oscilação da faixa (parece pessoa corrigindo a linha)
            wobbleAmount: aiStyle ? aiStyle.wobbleAmount : 0,
            wobbleSpeed: aiStyle ? aiStyle.wobbleSpeed : 0,
            wobblePhase: aiStyle ? aiStyle.wobblePhase : 0,
            mistakeTimer: 0,
            mistakeChance: aiStyle ? aiStyle.mistakeChance : 0,
          };
        }

        const player = makeRacer(
          "player",
          "Você",
          new BABYLON.Color3(0.15, 0.75, 1),
          new BABYLON.Color3(1, 0.2, 0.85),
          true,
          null
        );

        // Nova: mais agressiva, erra mais
        const rivalA = makeRacer(
          "rivalA",
          "Nova",
          new BABYLON.Color3(1, 0.35, 0.15),
          new BABYLON.Color3(1, 0.85, 0.2),
          false,
          {
            preferredLane: -2.4,
            lookAhead: 16,
            steerDeadzone: 0.16,
            curveCaution: 0.12,
            wobbleAmount: 1.4,
            wobbleSpeed: 1.7,
            wobblePhase: 0.4,
            mistakeChance: 0.012,
          }
        );

        // Echo: um pouco mais seguro, ainda humano
        const rivalB = makeRacer(
          "rivalB",
          "Echo",
          new BABYLON.Color3(0.55, 0.25, 1),
          new BABYLON.Color3(0.3, 1, 0.7),
          false,
          {
            preferredLane: 2.4,
            lookAhead: 20,
            steerDeadzone: 0.14,
            curveCaution: 0.2,
            wobbleAmount: 0.9,
            wobbleSpeed: 1.2,
            wobblePhase: 2.1,
            mistakeChance: 0.008,
          }
        );

        const racers = [player, rivalA, rivalB];

        const camera = new BABYLON.FollowCamera(
          "marioKartCam",
          new BABYLON.Vector3(0, 12, -16),
          scene,
          player.mesh
        );
        camera.radius = 14;
        camera.heightOffset = 10;
        camera.rotationOffset = 180;
        camera.cameraAcceleration = 0.05;
        camera.maxCameraSpeed = 20;
        camera.inputs.clear();

        // Câmera do hub: carro no centro, girando (estilo Brawl Stars)
        const menuCamera = new BABYLON.ArcRotateCamera(
          "menuCam",
          -Math.PI / 2,
          1.15,
          8.5,
          player.mesh.position,
          scene
        );
        menuCamera.lowerRadiusLimit = 7;
        menuCamera.upperRadiusLimit = 11;
        menuCamera.wheelPrecision = 40;
        menuCamera.panningSensibility = 0;
        menuCamera.inputs.clear();

        // Âncora fixa: a FollowCamera desacelera até ela (parada suave)
        const cameraAnchor = new BABYLON.TransformNode("cameraAnchor", scene);
        let finishCameraLocked = false;

        function lockCameraAtFinish() {
          if (finishCameraLocked) return;
          finishCameraLocked = true;
          // Fixa onde o carro estava ao cruzar — a câmera ainda "chega" com suavidade
          cameraAnchor.position.copyFrom(player.mesh.position);
          cameraAnchor.rotation.y = player.mesh.rotation.y;
          camera.lockedTarget = cameraAnchor;
          camera.cameraAcceleration = 0.025;
          camera.maxCameraSpeed = 6;
        }

        function unlockCameraFollow() {
          finishCameraLocked = false;
          camera.lockedTarget = player.mesh;
          camera.cameraAcceleration = 0.05;
          camera.maxCameraSpeed = 20;
          camera.radius = 14;
          camera.heightOffset = 10;
          camera.rotationOffset = 180;
        }

        function setRivalVisibility(visible) {
          rivalA.mesh.setEnabled(visible);
          rivalB.mesh.setEnabled(visible);
        }

        function enterMenuCamera() {
          placeGrid();
          setRivalVisibility(false);
          player.mesh.rotation.z = 0;
          menuCamera.setTarget(player.mesh.position.add(new BABYLON.Vector3(0, 0.6, 0)));
          menuCamera.alpha = -Math.PI / 2;
          menuCamera.beta = 1.15;
          menuCamera.radius = 8.5;
          scene.activeCamera = menuCamera;
        }

        function enterRaceCamera() {
          setRivalVisibility(true);
          unlockCameraFollow();
          scene.activeCamera = camera;
        }

        let raceTime = 0;
        let raceOver = false;
        const finishOrder = [];
        let inMenu = true;
        let countdownActive = false;
        let countdownTimer = 0;
        let countdownStep = 0; // 0=3, 1=2, 2=1
        let goDisplayTimer = 0;
        const countdownLabels = ["3", "2", "1"];

        function placeRacer(racer, distance, lateral) {
          const sample = samplePath(path3D, Math.max(0, distance));
          const pos = sample.position.add(sample.binormal.scale(lateral));
          racer.mesh.position.copyFrom(pos);
          racer.mesh.position.y = 0;
          racer.mesh.rotation.y = Math.atan2(sample.tangent.x, sample.tangent.z);
          racer.mesh.rotation.z = 0;
          racer.speed = 0;
          racer.distAlong = distanceAlongPath(path3D, racer.mesh.position);
          racer.progress = raceProgressFromDistance(racer.distAlong, track);
          racer.finished = false;
          racer.finishTime = null;
          // Ainda "antes" da linha de chegada
          racer.prevFinishSide = -1;
        }

        function placeGrid() {
          placeRacer(player, track.startDist, 0);
          placeRacer(rivalA, track.startDist, -2.4);
          placeRacer(rivalB, track.startDist, 2.4);
        }

        function showMainMenu() {
          inMenu = true;
          raceOver = false;
          countdownActive = false;
          goDisplayTimer = 0;
          GameAudio.stopEngines();
          finishOrder.length = 0;
          rankingPanel.classList.remove("show");
          rankingHint.classList.remove("show");
          rankingList.innerHTML = "";
          countdownOverlay.classList.remove("show");
          hud.classList.remove("show");
          mainMenu.classList.add("show");
          progressLabel.textContent = "Progresso: 0%";
          placeLabel.textContent = "Posição: 1º / 3";
          speedLabel.textContent = "Velocidade: 0";
          enterMenuCamera();
        }

        function startCountdown() {
          countdownActive = true;
          countdownTimer = 0;
          countdownStep = 0;
          goDisplayTimer = 0;
          countdownNumber.textContent = countdownLabels[0];
          countdownOverlay.classList.add("show");
          GameAudio.unlock();
          GameAudio.playCountdownBeep(false);
        }

        function startRaceFromMenu() {
          inMenu = false;
          raceTime = 0;
          raceOver = false;
          mainMenu.classList.remove("show");
          hud.classList.add("show");
          placeGrid();
          enterRaceCamera();
          finishOrder.length = 0;
          rankingPanel.classList.remove("show");
          rankingHint.classList.remove("show");
          rankingList.innerHTML = "";
          progressLabel.textContent = "Progresso: 0%";
          placeLabel.textContent = "Posição: 1º / 3";
          speedLabel.textContent = "Velocidade: 0";
          startCountdown();
        }

        btnStartRace.addEventListener("click", function () {
          startRaceFromMenu();
        });

        window.addEventListener("keydown", (e) => {
          if (e.code === "KeyR" && raceOver) {
            showMainMenu();
          }
        });

        showMainMenu();

        function getAIInput(racer, dt) {
          const t = path3D.getClosestPositionTo(racer.mesh.position);
          // Após a chegada, ainda mira o trecho extra da pista
          const lookT = Math.min(1, t + racer.lookAhead / trackLength);

          const tanNow = path3D.getTangentAt(t).normalize();
          const tanAhead = path3D.getTangentAt(lookT).normalize();
          const bend = 1 - BABYLON.Vector3.Dot(tanNow, tanAhead);

          const laneOffset =
            racer.preferredLane +
            Math.sin(raceTime * racer.wobbleSpeed + racer.wobblePhase) *
              racer.wobbleAmount;

          const target = path3D
            .getPointAt(lookT)
            .add(path3D.getBinormalAt(lookT).normalize().scale(laneOffset));

          const toTarget = target.subtract(racer.mesh.position);
          const desiredYaw = Math.atan2(toTarget.x, toTarget.z);
          let yawError = normalizeAngle(desiredYaw - racer.mesh.rotation.y);

          if (!racer.finished) {
            if (racer.mistakeTimer > 0) {
              racer.mistakeTimer -= dt;
              yawError *= -0.35;
            } else if (Math.random() < racer.mistakeChance) {
              racer.mistakeTimer = 0.2 + Math.random() * 0.25;
            }
          }

          const left = yawError < -racer.steerDeadzone;
          const right = yawError > racer.steerDeadzone;

          const sharpCurve = bend > racer.curveCaution;
          const badlyAligned = Math.abs(yawError) > 0.55;
          // Depois da chegada: só desacelera (sem acelerar)
          const up = !racer.finished && !sharpCurve && !badlyAligned;
          const down =
            !racer.finished &&
            sharpCurve &&
            bend > racer.curveCaution + 0.08;

          return { up, down, left, right };
        }

        function applyDrive(racer, input, dt) {
          // Após cruzar a chegada: não acelera mais, só desacelera e pode virar
          const coasting = racer.finished;
          const throttleUp = !coasting && input.up;
          const throttleDown = !coasting && input.down;

          if (throttleUp) {
            racer.speed += PHYSICS.accel * dt;
          } else if (throttleDown) {
            racer.speed -= PHYSICS.brake * dt;
          } else {
            const friction = coasting
              ? PHYSICS.friction * 2.4
              : PHYSICS.friction;
            if (racer.speed > 0) racer.speed -= friction * dt;
            else if (racer.speed < 0) racer.speed += friction * dt;
            if (Math.abs(racer.speed) < 0.2) racer.speed = 0;
          }

          racer.speed = Math.max(-12, Math.min(PHYSICS.maxSpeed, racer.speed));

          const steerPower = Math.min(1, Math.abs(racer.speed) / 10);
          if (input.left) racer.mesh.rotation.y -= PHYSICS.turnRate * steerPower * dt;
          if (input.right) racer.mesh.rotation.y += PHYSICS.turnRate * steerPower * dt;

          let targetRoll = 0;
          if (input.left) targetRoll = 0.18;
          if (input.right) targetRoll = -0.18;
          racer.mesh.rotation.z +=
            (targetRoll - racer.mesh.rotation.z) * Math.min(1, 8 * dt);

          const forward = new BABYLON.Vector3(
            Math.sin(racer.mesh.rotation.y),
            0,
            Math.cos(racer.mesh.rotation.y)
          );
          racer.mesh.position.addInPlace(forward.scale(racer.speed * dt));
          racer.mesh.position.y = 0;

          const t = path3D.getClosestPositionTo(racer.mesh.position);
          const closest = path3D.getPointAt(t);
          const binormal = path3D.getBinormalAt(t).normalize();
          const lateral = BABYLON.Vector3.Dot(
            racer.mesh.position.subtract(closest),
            binormal
          );

          if (Math.abs(lateral) > PHYSICS.laneLimit) {
            const excess = Math.abs(lateral) - PHYSICS.laneLimit;
            racer.mesh.position.addInPlace(
              binormal.scale(-Math.sign(lateral) * excess)
            );
            racer.speed *= 0.97;
          }

          racer.distAlong = distanceAlongPath(path3D, racer.mesh.position);
          if (!racer.finished) {
            racer.progress = raceProgressFromDistance(racer.distAlong, track);
          } else {
            racer.progress = 1;
          }

          // Só marca chegada ao CRUZAR a linha (sem congelar a velocidade)
          const toFinish = racer.mesh.position.subtract(finishSample.position);
          const finishSide = BABYLON.Vector3.Dot(toFinish, finishSample.tangent);
          const nearFinish = racer.distAlong > track.finishDist - 35;

          if (
            !racer.finished &&
            nearFinish &&
            racer.prevFinishSide < 0 &&
            finishSide >= 0
          ) {
            racer.finished = true;
            racer.finishTime = raceTime;
            racer.progress = 1;
            finishOrder.push(racer);
            GameAudio.playFinish(racer.isPlayer);
            updateRankingPanel();
          }
          racer.prevFinishSide = finishSide;
        }

        function getPlayerPlace() {
          let place = 1;
          for (const other of racers) {
            if (other === player) continue;
            if (other.finished && player.finished) {
              if (other.finishTime < player.finishTime) place += 1;
            } else if (other.finished && !player.finished) {
              place += 1;
            } else if (!other.finished && !player.finished) {
              if (other.progress > player.progress + 0.001) place += 1;
            }
          }
          return place;
        }

        function allRacersFinished() {
          return racers.every(function (racer) {
            return racer.finished;
          });
        }

        function placeText(place) {
          return place + "º";
        }

        function updateRankingPanel() {
          rankingPanel.classList.add("show");
          rankingList.innerHTML = "";

          finishOrder.forEach(function (racer, index) {
            const row = document.createElement("div");
            row.className = "ranking-row" + (racer.isPlayer ? " you" : "");
            row.innerHTML =
              '<span class="pos">' +
              placeText(index + 1) +
              "</span>" +
              "<span>" +
              racer.name +
              "</span>" +
              '<span class="time">' +
              racer.finishTime.toFixed(1) +
              "s</span>";
            rankingList.appendChild(row);
          });

          racers.forEach(function (racer) {
            if (racer.finished) return;
            const row = document.createElement("div");
            row.className =
              "ranking-row pending" + (racer.isPlayer ? " you" : "");
            row.innerHTML =
              '<span class="pos">—</span>' +
              "<span>" +
              racer.name +
              "</span>" +
              '<span class="time">...</span>';
            rankingList.appendChild(row);
          });

          if (allRacersFinished() && !raceOver) {
            raceOver = true;
            const finalPlace = getPlayerPlace();
            const gained = rewardCoinsForPlace(finalPlace);
            progressLabel.textContent = "Progresso: 100%";
            placeLabel.textContent =
              "Posição: " + placeText(finalPlace) + " / 3";
            rankingHint.textContent =
              gained > 0
                ? "+" +
                  gained +
                  " moedas! Pressione R para voltar ao menu"
                : "Sem moedas desta vez. Pressione R para voltar ao menu";
            rankingHint.classList.add("show");
          }
        }

        scene.onBeforeRenderObservable.add(() => {
          const dt = engine.getDeltaTime() / 1000;

          // Hub: carro no centro girando + câmera orbitando
          if (inMenu) {
            GameAudio.stopEngines();
            player.mesh.rotation.y += dt * 0.55;
            menuCamera.alpha += dt * 0.22;
            menuCamera.setTarget(
              player.mesh.position.add(new BABYLON.Vector3(0, 0.6, 0))
            );
            return;
          }

          // Contagem: ninguém anda
          if (countdownActive) {
            countdownTimer += dt;
            if (countdownTimer >= 1) {
              countdownTimer = 0;
              countdownStep += 1;
              if (countdownStep >= countdownLabels.length) {
                countdownActive = false;
                countdownNumber.textContent = "VAI!";
                goDisplayTimer = 0.7;
                GameAudio.playCountdownBeep(true);
              } else {
                countdownNumber.textContent = countdownLabels[countdownStep];
                GameAudio.playCountdownBeep(false);
              }
            }
            return;
          }

          if (goDisplayTimer > 0) {
            goDisplayTimer -= dt;
            if (goDisplayTimer <= 0) {
              countdownOverlay.classList.remove("show");
            }
          }

          if (!raceOver) {
            raceTime += dt;
          }

          // Depois da chegada o jogador só desacelera (ainda pode virar)
          const playerInput = player.finished
            ? { up: false, down: false, left: keys.left, right: keys.right }
            : keys;

          applyDrive(player, playerInput, dt);
          applyDrive(rivalA, getAIInput(rivalA, dt), dt);
          applyDrive(rivalB, getAIInput(rivalB, dt), dt);

          // Motores dos 3 carros (rivais mais baixos quando longe)
          GameAudio.setEngineSpeed("player", player.speed, PHYSICS.maxSpeed);
          GameAudio.setEngineSpeed(
            "rivalA",
            rivalA.speed,
            PHYSICS.maxSpeed,
            BABYLON.Vector3.Distance(player.mesh.position, rivalA.mesh.position)
          );
          GameAudio.setEngineSpeed(
            "rivalB",
            rivalB.speed,
            PHYSICS.maxSpeed,
            BABYLON.Vector3.Distance(player.mesh.position, rivalB.mesh.position)
          );

          // Câmera desacelera e assenta na chegada (sem salto brusco)
          if (player.finished) {
            lockCameraAtFinish();
          }

          const place = getPlayerPlace();
          placeLabel.textContent = "Posição: " + placeText(place) + " / 3";
          speedLabel.textContent =
            "Velocidade: " + Math.round(Math.abs(player.speed));

          if (!player.finished) {
            const progress = Math.floor(player.progress * 100);
            progressLabel.textContent =
              "Progresso: " + Math.max(0, Math.min(99, progress)) + "%";
          } else if (!raceOver) {
            progressLabel.textContent =
              "Chegou! Aguardando os outros...";
          }
        });

        return scene;
      };

      const scene = createScene();

      engine.runRenderLoop(function () {
        scene.render();
        if (debugEnabled) {
          debugFpsFrame += 1;
          // Atualiza o DOM de tempos em tempos para não pesar o FPS
          if (debugFpsFrame % 15 === 0) {
            debugFps.textContent = Math.round(engine.getFps()) + " FPS";
          }
        }
      });

      window.addEventListener("resize", function () {
        engine.resize();
      });
    </script>
  </body>
</html>
